<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:#050505;font-family:Inter,system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px;position:relative;}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(0,255,65,.12),transparent);pointer-events:none;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
.inner{position:relative;z-index:1;max-width:800px;}
.brand{font-size:12px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:#00FF41;margin-bottom:20px;}
h1{font-size:60px;font-weight:900;line-height:1.0;background:linear-gradient(135deg,#00FF41,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;}
.sub{font-size:20px;color:#94a3b8;line-height:1.5;margin-bottom:32px;}
.cards{display:flex;gap:24px;justify-content:center;}
.card{background:rgba(0,255,65,.06);border:1px solid rgba(0,255,65,.2);border-radius:14px;padding:20px 28px;text-align:center;}
.card-v{font-size:2.4rem;font-weight:900;}
.card-l{font-size:13px;color:#94a3b8;margin-top:6px;}
.card2{background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.2);}
.card3{background:rgba(0,210,255,.04);border:1px solid rgba(0,210,255,.2);}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="inner">
  <div class="brand">PRODIGY Lab Dental · Programa de Referidos</div>
  <h1>Refiere y Gana</h1>
  <p class="sub">Comparte tu código con colegas odontólogos. Sin límite de referidos.</p>
  <div class="cards">
    <div class="card"><div class="card-v" style="color:#00FF41;">5%</div><div class="card-l">Descuento para tu colega en su primer caso</div></div>
    <div class="card card2"><div class="card-v" style="color:#D4AF37;">$30K</div><div class="card-l">COP de crédito que tú recibes</div></div>
    <div class="card card3"><div class="card-v" style="color:#00d2ff;">∞</div><div class="card-l">Referidos con el mismo código</div></div>
  </div>
</div>
</body>
</html>
