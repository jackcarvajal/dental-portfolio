<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:#050505;font-family:Inter,system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px;position:relative;}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(0,210,255,.10),transparent);pointer-events:none;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,210,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,210,255,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
.inner{position:relative;z-index:1;max-width:860px;}
.brand{font-size:13px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:#D946A6;margin-bottom:20px;}
h1{font-size:64px;font-weight:900;line-height:1.05;color:#fff;margin-bottom:18px;}
h1 span{color:#D4AF37;}
.sub{font-size:21px;color:#94a3b8;line-height:1.5;margin-bottom:32px;}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.pill{padding:7px 18px;border-radius:50px;font-size:14px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid #00d2ff;color:#00d2ff;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="inner">
  <div class="brand">PRODIGY Lab Dental · Bogotá, Colombia</div>
  <h1>Frequently asked <span>questions</span></h1>
  <p class="sub">Remote dental CAD design for clinics and labs abroad.</p>
  <div class="pills">
    <div class="pill">Exocad &amp; 3Shape</div>
    <div class="pill">USD · PayPal or Wise</div>
    <div class="pill">Files received 24/7</div>
  </div>
</div>
</body>
</html>
