<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121c33"/>
      <stop offset="1" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="crown" x1="0.08" y1="0.2" x2="0.92" y2="0.5">
      <stop offset="0" stop-color="#ef5bbf"/>
      <stop offset="0.55" stop-color="#b07bff"/>
      <stop offset="1" stop-color="#2fd2ff"/>
    </linearGradient>
    <linearGradient id="pav" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d4469f"/>
      <stop offset="0.5" stop-color="#8f6fe0"/>
      <stop offset="1" stop-color="#e0b53a"/>
    </linearGradient>
  </defs>

  <!-- fondo redondeado (pop en fondos claros y oscuros) -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- DIAMANTE: silueta grande, 2 cuerpos (corona + pabellón) -->
  <!-- corona (trapecio superior) -->
  <polygon points="190,170 322,170 416,250 96,250" fill="url(#crown)"/>
  <!-- pabellón (triángulo inferior) -->
  <polygon points="96,250 416,250 256,440" fill="url(#pav)"/>

  <!-- table highlight (brillo superior) -->
  <polygon points="190,170 322,170 300,210 212,210" fill="#ffffff" opacity="0.30"/>

  <!-- facetas: líneas sutiles para dar gema sin ensuciar a 16px -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" fill="none">
    <line x1="212" y1="210" x2="190" y2="250"/>
    <line x1="300" y1="210" x2="322" y2="250"/>
    <line x1="256" y1="170" x2="256" y2="210"/>
  </g>
  <g stroke="#05070e" stroke-opacity="0.28" stroke-width="3" fill="none">
    <line x1="190" y1="250" x2="256" y2="440"/>
    <line x1="322" y1="250" x2="256" y2="440"/>
    <line x1="256" y1="250" x2="256" y2="440"/>
  </g>
  <!-- girdle (línea de cintura) -->
  <line x1="96" y1="250" x2="416" y2="250" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
</svg>
