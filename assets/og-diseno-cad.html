<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:#050505;font-family:'Inter',system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:60px;}
.left{flex:1;max-width:620px;}
.brand{font-size:14px;font-weight:900;letter-spacing:4px;color:#D4AF37;text-transform:uppercase;margin-bottom:28px;}
h1{font-size:52px;font-weight:900;line-height:1.05;color:#fff;margin-bottom:20px;}
h1 span{background:linear-gradient(135deg,#D946A6,#9333ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{font-size:18px;color:#94a3b8;line-height:1.5;margin-bottom:32px;}
.badges{display:flex;gap:10px;flex-wrap:wrap;}
.badge{background:rgba(217,70,166,.12);border:1px solid rgba(217,70,166,.3);color:#D946A6;border-radius:50px;padding:6px 16px;font-size:13px;font-weight:700;}
.badge.gold{background:rgba(212,175,55,.1);border-color:rgba(212,175,55,.3);color:#D4AF37;}
.right{width:400px;height:400px;background:linear-gradient(135deg,rgba(217,70,166,.15),rgba(147,51,234,.1));border-radius:32px;border:1px solid rgba(217,70,166,.2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.icon-big{font-size:120px;}
.stats{display:flex;gap:24px;}
.stat{text-align:center;}
.stat-n{font-size:28px;font-weight:900;color:#fff;}
.stat-l{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(217,70,166,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(217,70,166,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="left">
  <div class="brand">PRODIGY Lab Dental</div>
  <h1>Diseño CAD<br><span>Remoto</span></h1>
  <p class="sub">Envíanos tu escáner intraoral y recibe tu diseño Exocad en 24–48h. Corona, puente, carilla, implante.</p>
  <div class="badges">
    <div class="badge">Exocad certified</div>
    <div class="badge gold">Bogotá, Colombia</div>
    <div class="badge">STL → HTML en 24h</div>
  </div>
</div>
<div class="right">
  <div class="icon-big">🦷</div>
  <div class="stats">
    <div class="stat"><div class="stat-n">24h</div><div class="stat-l">Entrega</div></div>
    <div class="stat"><div class="stat-n">98%</div><div class="stat-l">Aprobación</div></div>
    <div class="stat"><div class="stat-n">20+</div><div class="stat-l">Países</div></div>
  </div>
</div>
</body>
</html>
