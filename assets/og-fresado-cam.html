<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:#050505;font-family:'Inter',system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:60px;}
.left{flex:1;max-width:620px;}
.brand{font-size:14px;font-weight:900;letter-spacing:4px;color:#D4AF37;text-transform:uppercase;margin-bottom:28px;}
h1{font-size:52px;font-weight:900;line-height:1.05;color:#fff;margin-bottom:20px;}
h1 span{background:linear-gradient(135deg,#D4AF37,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{font-size:18px;color:#94a3b8;line-height:1.5;margin-bottom:32px;}
.badges{display:flex;gap:10px;flex-wrap:wrap;}
.badge{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);color:#D4AF37;border-radius:50px;padding:6px 16px;font-size:13px;font-weight:700;}
.badge.cyan{background:rgba(0,210,255,.08);border-color:rgba(0,210,255,.3);color:#00d2ff;}
.right{width:400px;height:400px;background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(212,175,55,.04));border-radius:32px;border:1px solid rgba(212,175,55,.2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.icon-big{font-size:120px;}
.stats{display:flex;gap:24px;}
.stat{text-align:center;}
.stat-n{font-size:28px;font-weight:900;color:#D4AF37;}
.stat-l{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(212,175,55,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="left">
  <div class="brand">PRODIGY Lab Dental</div>
  <h1>Fresado<br><span>CAM</span> Dental</h1>
  <p class="sub">Zirconio, PMMA, cera y titanio fresados con precisión ±20μm. Desde $60.000 COP por unidad. Envío nacional.</p>
  <div class="badges">
    <div class="badge">Zirconio multilayer</div>
    <div class="badge cyan">Precisión ±20μm</div>
    <div class="badge">Colombia → Nacional</div>
  </div>
</div>
<div class="right">
  <div class="icon-big">⚙️</div>
  <div class="stats">
    <div class="stat"><div class="stat-n">48h</div><div class="stat-l">Entrega</div></div>
    <div class="stat"><div class="stat-n">±20μm</div><div class="stat-l">Precisión</div></div>
    <div class="stat"><div class="stat-n">5+</div><div class="stat-l">Materiales</div></div>
  </div>
</div>
</body>
</html>
