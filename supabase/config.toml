# webhook-handler recibe webhooks de Wompi, que NO envían un JWT de Supabase —
# debe ser público (verify_jwt = false). Se fija aquí explícitamente para que un
# redeploy desde el repo no rompa los pagos (default verify_jwt = true rechazaría
# a Wompi con 401) ni deje la postura de auth sin versionar. La barrera real es
# la verificación de firma HMAC dentro de index.ts.
[functions.webhook-handler]
verify_jwt = false

# wompi-signature y verify-price las llama el checkout de Wompi (js/pagos.js) SIN un JWT
# de Supabase. Si un redeploy desde el repo las dejara en el default (verify_jwt = true),
# Supabase las rechazaría con 401 y los pagos se romperían en silencio. La barrera real es
# server-side dentro de index.ts (wompi-signature firma el precio autoritativo de la BD, no
# el del cliente). Ver PENDIENTES.md → "wompi-signature firmaba montos arbitrarios".
[functions.wompi-signature]
verify_jwt = false

[functions.verify-price]
verify_jwt = false
