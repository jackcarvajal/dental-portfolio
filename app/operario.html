<style>
:root {
  --bg:#050505; --card:#0a0f1a; --txt:#fff; --muted:#94a3b8;
  --border:rgba(255,255,255,.08);
  --dis:#00d2ff; --frs:#D4AF37; --imp:#fb923c; --tal:#a78bfa; --men:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',sans-serif;min-height:100vh;visibility:hidden;}
body.ready{visibility:visible;}

/* Header */
.top-bar{background:#050e1a;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;}
.top-bar h1{font-size:1rem;font-weight:900;letter-spacing:2px;color:#D946A6;}
.top-bar p{font-size:.72rem;color:var(--muted);margin-top:2px;}
.dept-tabs{display:flex;gap:8px;flex-wrap:wrap;}
.dept-tab{padding:6px 16px;border-radius:50px;font-size:.75rem;font-weight:700;border:1px solid;cursor:pointer;transition:.2s;background:transparent;}
.dept-tab.active{color:#000!important;}
.dept-tab[data-dept="diseno"]{color:var(--dis);border-color:rgba(0,210,255,.3);}
.dept-tab[data-dept="diseno"].active{background:var(--dis);border-color:var(--dis);}
.dept-tab[data-dept="fresado"]{color:var(--frs);border-color:rgba(212,175,55,.3);}
.dept-tab[data-dept="fresado"].active{background:var(--frs);border-color:var(--frs);}
.dept-tab[data-dept="impresion"]{color:var(--imp);border-color:rgba(251,146,60,.3);}
.dept-tab[data-dept="impresion"].active{background:var(--imp);border-color:var(--imp);}
.dept-tab[data-dept="taller"]{color:var(--tal);border-color:rgba(167,139,250,.3);}
.dept-tab[data-dept="taller"].active{background:var(--tal);border-color:var(--tal);}

/* Main */
.main{padding:20px 24px;max-width:1400px;margin:0 auto;}
.dept-panel{display:none;}
.dept-panel.active{display:block;}

/* Timer */
.timer-bar{border-radius:10px;padding:10px 16px;margin-bottom:18px;display:none;align-items:center;gap:12px;font-size:.82rem;flex-wrap:wrap;}
.timer-bar.visible{display:flex;}
.timer-bar.alerta{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);color:#fbbf24;}
.timer-bar.critico{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;}

/* Kanban */
.kanban{display:grid;gap:14px;}
.kanban.cols-3{grid-template-columns:repeat(3,1fr);}
.kanban.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1100px){.kanban.cols-4,.kanban.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.kanban.cols-4,.kanban.cols-3{grid-template-columns:1fr;}}
.k-col{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
.k-hdr{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;}
.k-count{background:rgba(255,255,255,.08);border-radius:10px;padding:2px 8px;font-size:.65rem;}

/* Cards */
.caso-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:14px;margin-bottom:10px;transition:.2s;}
.caso-card:hover{background:rgba(255,255,255,.05);}
.caso-id{font-size:.68rem;color:var(--muted);font-family:monospace;margin-bottom:3px;}
.caso-nombre{font-size:.88rem;font-weight:700;margin-bottom:5px;}
.caso-meta{font-size:.72rem;color:var(--muted);line-height:1.7;}
.caso-actions{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
.card-badge{font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:6px;}
.card-timer{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:6px;margin-bottom:6px;display:inline-block;}
.timer-ok{background:rgba(0,255,65,.1);color:#00FF41;}
.timer-alerta{background:rgba(251,191,36,.1);color:#fbbf24;}
.timer-critico{background:rgba(239,68,68,.15);color:#ef4444;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Botones */
.btn{padding:5px 11px;border-radius:6px;font-size:.68rem;font-weight:700;border:1px solid;cursor:pointer;background:transparent;display:inline-flex;align-items:center;gap:4px;color:inherit;transition:.15s;white-space:nowrap;}
.btn-dis{color:var(--dis);border-color:rgba(0,210,255,.3);}  .btn-dis:hover{background:rgba(0,210,255,.1);}
.btn-frs{color:var(--frs);border-color:rgba(212,175,55,.3);}  .btn-frs:hover{background:rgba(212,175,55,.1);}
.btn-imp{color:var(--imp);border-color:rgba(251,146,60,.3);}  .btn-imp:hover{background:rgba(251,146,60,.1);}
.btn-grn{color:#00FF41;border-color:rgba(0,255,65,.3);}       .btn-grn:hover{background:rgba(0,255,65,.1);}
.btn-red{color:#ef4444;border-color:rgba(239,68,68,.3);}      .btn-red:hover{background:rgba(239,68,68,.1);}
.btn-ylw{color:#fbbf24;border-color:rgba(251,191,36,.3);}     .btn-ylw:hover{background:rgba(251,191,36,.1);}

/* Modal QA */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-ov.open{display:flex;}
.modal{background:#0a1525;border:1px solid rgba(217,70,166,.35);border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:.95rem;font-weight:800;color:#D946A6;margin-bottom:4px;}
.modal p{font-size:.75rem;color:var(--muted);margin-bottom:18px;}
.qa-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.qa-row:last-of-type{border-bottom:none;}
.qa-row label{font-size:.82rem;cursor:pointer;}
.qa-row input[type=checkbox]{width:15px;height:15px;flex-shrink:0;margin-top:2px;accent-color:#D946A6;}
.qa-link,.qa-notes{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 12px;color:#e2e8f0;font-family:inherit;font-size:.82rem;margin-top:12px;}
.qa-notes{resize:vertical;min-height:70px;}
.qa-link:focus,.qa-notes:focus{outline:none;border-color:#D946A6;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0d1520;border:1px solid var(--border);color:#e2e8f0;padding:10px 22px;border-radius:8px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;}
#toast.show{opacity:1;} #toast.ok{border-color:#00FF41;color:#00FF41;} #toast.err{border-color:#ef4444;color:#ef4444;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>⚙️ PRODIGY — Panel Operario</h1>
    <p id="hdr-user">Cargando…</p>
  </div>
  <div class="dept-tabs" id="dept-tabs"></div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button type="button" class="btn btn-grn" onclick="recargar()" aria-label="Recargar casos"><i class="fas fa-rotate-right"></i></button>
    <button type="button" class="btn btn-red" onclick="ProdigyAuth.signOut()" style="font-size:.68rem;">Salir</button>
  </div>
</div>

<div class="main" id="main-content" aria-live="polite" aria-label="Casos del operario">
  <p style="color:var(--muted);padding:40px;text-align:center;"><i class="fas fa-circle-notch fa-spin" style="font-size:1.5rem;display:block;margin-bottom:12px;" aria-hidden="true"></i>Cargando departamentos…</p>
</div>

<!-- Modal Subir Diseño -->
<div class="modal-ov" id="modal-subir" role="dialog" aria-modal="true" aria-labelledby="modal-subir-title">
  <div class="modal" style="max-width:520px;">
    <h3 id="modal-subir-title"><i class="fas fa-upload" style="margin-right:8px;"></i>Subir archivos de diseño</h3>
    <p id="subir-sub">Caso #—</p>
    <div style="display:grid;gap:12px;">
      <div>
        <label style="font-size:.72rem;font-weight:700;color:#D946A6;display:block;margin-bottom:5px;">
          <i class="fas fa-file-code" style="margin-right:4px;"></i>Visor HTML Exocad <span style="color:#ef4444;">*</span>
        </label>
        <input type="file" id="up-html" accept=".html,.htm" class="qa-link" style="cursor:pointer;">
      </div>
      <div>
        <label style="font-size:.72rem;font-weight:700;color:var(--dis);display:block;margin-bottom:5px;">
          <i class="fas fa-cube" style="margin-right:4px;"></i>Archivos STL (puedes seleccionar varios)
        </label>
        <input type="file" id="up-stl" accept=".stl,.zip" multiple class="qa-link" style="cursor:pointer;">
      </div>
      <div>
        <label style="font-size:.72rem;font-weight:700;color:var(--frs);display:block;margin-bottom:5px;">
          <i class="fas fa-file-archive" style="margin-right:4px;"></i>Construinfo / Parámetros de construcción
        </label>
        <input type="file" id="up-cinfo" accept=".zip,.pdf,.xlsx,.csv,.xml,.constructioninfo" class="qa-link" style="cursor:pointer;">
      </div>
      <div>
        <label style="font-size:.72rem;font-weight:700;color:#00FF41;display:block;margin-bottom:5px;">
          <i class="fas fa-images" style="margin-right:4px;"></i>Fotos del diseño (capturas / renders)
        </label>
        <input type="file" id="up-fotos" accept="image/*" multiple class="qa-link" style="cursor:pointer;">
      </div>
    </div>
    <div id="up-progress" style="display:none;margin-top:14px;">
      <div style="background:rgba(255,255,255,.06);border-radius:6px;height:6px;overflow:hidden;">
        <div id="up-bar" style="height:100%;background:#D946A6;width:0%;transition:width .3s;border-radius:6px;"></div>
      </div>
      <p id="up-status" style="font-size:.72rem;color:var(--muted);margin-top:6px;text-align:center;"></p>
    </div>
    <input type="hidden" id="subir-id">
    <div class="modal-btns">
      <button type="button" class="btn btn-red" onclick="cerrarSubirDiseno()">Cancelar</button>
      <button type="button" class="btn btn-ylw" id="btn-subir-ok" onclick="ejecutarSubida()">
        <i class="fas fa-upload"></i> Subir y enviar al doctor
      </button>
    </div>
  </div>
</div>

<!-- Modal QA -->
<div class="modal-ov" id="modal-qa" role="dialog" aria-modal="true" aria-labelledby="modal-qa-title">
  <div class="modal">
    <h3 id="qa-titulo"><i class="fas fa-check-double" style="margin-right:8px;"></i>Control de Calidad</h3>
    <p id="qa-sub">Caso #—</p>
    <div id="qa-checks"></div>
    <div id="qa-link-wrap" style="display:none;">
      <label style="font-size:.72rem;font-weight:700;color:var(--muted);display:block;margin-top:14px;margin-bottom:4px;">Link de entrega (Drive / WeTransfer)</label>
      <input type="url" id="qa-link" class="qa-link" placeholder="https://drive.google.com/…">
    </div>
    <textarea id="qa-notes" class="qa-notes" placeholder="Notas para el doctor o para producción…"></textarea>
    <input type="hidden" id="qa-id">
    <input type="hidden" id="qa-dept">
    <div class="modal-btns">
      <button type="button" class="btn btn-red"  onclick="cerrarQA()">Cancelar</button>
      <button type="button" class="btn btn-ylw"  id="qa-btn-cambios"  onclick="submitQA('cambios')">🔄 Cambios</button>
      <button type="button" class="btn btn-grn"  id="qa-btn-aprobar"  onclick="submitQA('aprobar')">✅ Aprobar</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Modal: confirmar acción operario (genérico) -->
<div id="modal-op-confirm" role="dialog" aria-modal="true" aria-labelledby="modal-op-title" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9500;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#0a1525;border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:24px;max-width:400px;width:100%;text-align:center;">
    <div id="modal-op-icon" style="font-size:2rem;margin-bottom:10px;"></div>
    <div id="modal-op-title" style="font-size:.95rem;font-weight:800;color:#D4AF37;margin-bottom:8px;"></div>
    <div id="modal-op-body" style="font-size:.8rem;color:#94a3b8;margin-bottom:20px;"></div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button type="button" onclick="cerrarModalOpConfirm()" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#94a3b8;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:.82rem;">Cancelar</button>
      <button type="button" id="modal-op-btn" onclick="ejecutarOpConfirm()" style="background:#D4AF37;color:#000;border:none;padding:8px 22px;border-radius:8px;font-weight:800;cursor:pointer;font-size:.82rem;"></button>
    </div>
  </div>
</div>

<script>
const SB_URL  = 'https://zgihrwqfyvgyapbwzkvw.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnaWhyd3FmeXZneWFwYnd6a3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNzczNDksImV4cCI6MjA5MDg1MzM0OX0.9CzmFDQYeQKcbtAZoT1_n_OuJ1qPVJu3jImd938T634';
const sb = window.supabase.createClient(SB_URL, SB_ANON);
window.sb = sb; // exponer para módulos externos (notif-panel.js)
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── Config por departamento ── */
const DEPTS = {
  diseno: {
    label:'Diseño CAD', icon:'fas fa-drafting-compass', color:'#00d2ff',
    flujos:['diseno'],
    cols:[
      {id:'pend',  label:'Por validar',   color:'#fbbf24', estados:['VALIDACION_PENDIENTE','INCIDENCIA_CLIENTE','CAMBIOS_SOLICITADOS']},
      {id:'work',  label:'Diseñando',     color:'#00d2ff', estados:['EN_DISENO']},
      {id:'rev',   label:'En revisión',   color:'#D4AF37', estados:['REVISION_CLIENTE']},
      {id:'done',  label:'Aprobado',      color:'#00FF41', estados:['DISENO_APROBADO','ENTREGADO']}
    ],
    timerHrs:{alerta:18, critico:22},
    qa:['Márgenes y troncocónico (mín. 6°)','Oclusión estática y dinámica OK','Anatomía: cúspides y forma correcta','Contactos proximales correctos','STL sin errores de malla','Espesor mínimo por material','Visor Exocad HTML adjunto'],
    acciones: {
      pend: p => `<button type="button" class="btn btn-dis" onclick="avanzar('${p.id}','EN_DISENO','diseno')"><i class="fas fa-play"></i> Iniciar</button>
                  <button type="button" class="btn btn-red" onclick="avanzar('${p.id}','INCIDENCIA_CLIENTE','diseno')"><i class="fas fa-exclamation"></i> Incidencia</button>`,
      work: p => `<button type="button" class="btn btn-ylw" onclick="abrirSubirDiseno('${p.id}','${esc(p.codigo)||''}')"><i class="fas fa-upload"></i> Subir diseño</button>
                  ${p.html_diseno_url ? `<button type="button" class="btn btn-dis" onclick="copiarLinkRevision('${p.id}')"><i class="fas fa-link"></i> Link Dr.</button>` : ''}`,
      rev:  p => `<button type="button" class="btn btn-dis" onclick="copiarLinkRevision('${p.id}')"><i class="fas fa-link"></i> Copiar link Dr.</button>
                  <button type="button" class="btn btn-ylw" onclick="avanzar('${p.id}','CAMBIOS_SOLICITADOS','diseno')"><i class="fas fa-redo"></i> Cambios manuales</button>
                  ${(p.cambios_count||0)>0?`<span style="font-size:.67rem;color:#D946A6;display:block;width:100%;margin-top:2px;">⚠️ ${p.cambios_count}/2 cambios</span>`:''}`,
      done: p => {
        const sigsServs = (p.servicios_pagados||[]).filter(s => s !== 'diseno' && s !== p.departamento_actual);
        const sigBtns = sigsServs.map(d => {
          const lbl   = d==='fresado'?'Fresado/Lab':d==='impresion'?'Impresión':d;
          const cls   = d==='fresado'?'btn-frs':'btn-imp';
          return `<button type="button" class="btn ${cls}" onclick="enviarASiguiente('${p.id}','${esc(d)}')"><i class="fas fa-arrow-right"></i> → ${esc(lbl)}</button>`;
        }).join('');
        return `${p.html_diseno_url?`<button type="button" class="btn btn-dis" onclick="copiarLinkRevision('${p.id}')"><i class="fas fa-link"></i> Link Dr.</button>`:''}
          ${p.link_diseno&&/^https?:\/\//.test(p.link_diseno)?`<a href="${esc(p.link_diseno)}" target="_blank" rel="noopener noreferrer" class="btn btn-grn"><i class="fas fa-external-link-alt"></i> Ver entrega</a>`:''}
          ${sigBtns}`;
      }
    }
  },
  fresado: {
    label:'Fresado / Lab', icon:'fas fa-cog', color:'#D4AF37',
    flujos:['fresado','lab'],
    cols:[
      {id:'pend', label:'Validar',      color:'#fbbf24', estados:['VALIDACION_PENDIENTE','INCIDENCIA_CLIENTE','DISENO_FINALIZADO']},
      {id:'prod', label:'Producción',   color:'#D4AF37', estados:['EN_PRODUCCION','FRESADO_INICIADO']},
      {id:'done', label:'Completado',   color:'#00FF41', estados:['QA_APROBADO','POR_DESPACHAR','EN_REPARTO','ENTREGADO']}
    ],
    timerHrs:{alerta:36, critico:48},
    qa:['Color VITA verificado con el pedido','Dimensiones dentro de tolerancia ±0.1mm','Superficie sin porosidades ni grietas','Glaze uniforme aplicado','Empaque protegido correctamente'],
    acciones: {
      pend: p => `<button type="button" class="btn btn-frs" onclick="avanzar('${p.id}','EN_PRODUCCION','fresado')"><i class="fas fa-play"></i> Iniciar</button>
                  <button type="button" class="btn btn-red" onclick="avanzar('${p.id}','INCIDENCIA_CLIENTE','fresado')"><i class="fas fa-exclamation"></i> Incidencia</button>`,
      prod: p => `<button type="button" class="btn btn-grn" onclick="abrirQA('${p.id}','${esc(p.codigo)||''}','fresado')"><i class="fas fa-check-double"></i> QA Final</button>
                  <button type="button" class="btn btn-frs" onclick="avanzar('${p.id}','FRESADO_INICIADO','fresado')"><i class="fas fa-cog fa-spin"></i> Fresando</button>`,
      done: _ => ''
    }
  },
  impresion: {
    label:'Impresión 3D', icon:'fas fa-print', color:'#fb923c',
    flujos:['impresion'],
    cols:[
      {id:'pend', label:'Por imprimir',  color:'#fbbf24', estados:['VALIDACION_PENDIENTE','INCIDENCIA_CLIENTE']},
      {id:'prod', label:'Imprimiendo',   color:'#fb923c', estados:['EN_PRODUCCION']},
      {id:'post', label:'Post-proceso',  color:'#D946A6', estados:['DISENO_FINALIZADO','FRESADO_INICIADO']},
      {id:'done', label:'Completado',    color:'#00FF41', estados:['QA_APROBADO','POR_DESPACHAR','EN_REPARTO','ENTREGADO']}
    ],
    timerHrs:{alerta:20, critico:28},
    qa:['Archivo STL validado sin errores','Soportes removidos completamente','Post-curado UV completo (mínimo 20 min)','Biocompatibilidad: color y superficie OK','Dimensiones verificadas'],
    acciones: {
      pend: p => `<button type="button" class="btn btn-imp" onclick="avanzar('${p.id}','EN_PRODUCCION','impresion')"><i class="fas fa-play"></i> Imprimir</button>
                  <button type="button" class="btn btn-red" onclick="avanzar('${p.id}','INCIDENCIA_CLIENTE','impresion')"><i class="fas fa-exclamation"></i> Incidencia</button>`,
      prod: p => `<button type="button" class="btn btn-ylw" onclick="avanzar('${p.id}','FRESADO_INICIADO','impresion')"><i class="fas fa-flask"></i> Post-proceso</button>`,
      post: p => `<button type="button" class="btn btn-grn" onclick="abrirQA('${p.id}','${esc(p.codigo)||''}','impresion')"><i class="fas fa-check-double"></i> QA Final</button>`,
      done: _ => ''
    }
  },
  taller: {
    label:'Taller / Mantenimiento', icon:'fas fa-tools', color:'#a78bfa',
    flujos:['taller'],
    cols:[
      {id:'pend', label:'Pendiente',     color:'#fbbf24', estados:['VALIDACION_PENDIENTE']},
      {id:'prod', label:'En proceso',    color:'#a78bfa', estados:['EN_PRODUCCION']},
      {id:'done', label:'Resuelto',      color:'#00FF41', estados:['QA_APROBADO','ENTREGADO']}
    ],
    timerHrs:{alerta:4, critico:8},
    qa:['Equipo funciona correctamente','Limpieza completada','Registro en bitácora'],
    acciones: {
      pend: p => `<button type="button" class="btn" style="color:var(--tal);border-color:rgba(167,139,250,.3)" onclick="avanzar('${p.id}','EN_PRODUCCION','taller')"><i class="fas fa-wrench"></i> Atender</button>`,
      prod: p => `<button type="button" class="btn btn-grn" onclick="abrirQA('${p.id}','${esc(p.codigo)||''}','taller')"><i class="fas fa-check"></i> Cerrar</button>`,
      done: _ => ''
    }
  }
};

/* ── Estado global ── */
let _myDepts = [];
let _activeDept = null;
let _casos = {};   // { dept: [] }
let _userId = null;

/* ── Init ── */
(async function init() {
  const session = await ProdigyAuth.require(['admin','operator','encargado_inventario','diseno','fresado','impresion','taller','mensajero']);
  if (!session) return;
  _userId = session.user.id;
  document.getElementById('hdr-user').textContent = session.user.email;

  /* Leer departamentos asignados */
  const { data: staff } = await sb.from('staff_departamentos')
    .select('departamentos,nombre,activo')
    .eq('user_id', _userId)
    .single();

  /* Admin ve todos los departamentos */
  const role = session.user.app_metadata?.role;
  window._currentRole = role || null; // exponer para notif-panel.js
  if (role === 'admin' || role === 'superadmin') {
    _myDepts = ['diseno','fresado','impresion','taller'];
  } else if (staff && staff.activo && staff.departamentos?.length) {
    _myDepts = staff.departamentos;
  } else {
    document.getElementById('main-content').innerHTML =
      '<div style="text-align:center;padding:60px;color:#94a3b8;"><i class="fas fa-lock" style="font-size:2rem;display:block;margin-bottom:12px;color:#ef4444;"></i>No tienes departamentos asignados.<br>Contacta al administrador.</div>';
    document.body.classList.add('ready');
    return;
  }

  if (staff?.nombre) {
    document.getElementById('hdr-user').textContent = staff.nombre + ' · ' + session.user.email;
  }

  window._myDepts = _myDepts; // exponer para notif-panel.js
  buildTabs();
  document.body.classList.add('ready');
  await recargar();
  setInterval(recargar, 60000);

  // Alertas: cotizaciones de fresado en borrador (sin convertir)
  sb.from('cotizaciones').select('id',{count:'exact',head:true}).eq('tipo','fresado').eq('estado','borrador').then(({count})=>{
    if(!count) return;
    const al=document.createElement('div');
    al.style.cssText='background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.2);border-radius:10px;padding:10px 16px;margin-bottom:12px;font-size:.8rem;color:#D4AF37;display:flex;align-items:center;gap:8px;';
    al.innerHTML=`<i class="fas fa-receipt" aria-hidden="true"></i> <strong>${count}</strong> cotizaciones de fresado guardadas sin convertir. <a href="contabilidad.html" style="color:#D4AF37;font-weight:700;text-decoration:underline;">Ver en contabilidad →</a>`;
    document.querySelector('.main,main')?.prepend(al);
  }).catch(()=>{});
  // Alerta: doctores en riesgo de churn (crítico)
  sb.from('doctors_inactivos').select('email',{count:'exact',head:true}).eq('nivel_riesgo','CRITICO').then(({count})=>{
    if(!count) return;
    const al=document.createElement('div');
    al.style.cssText='background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2);border-radius:10px;padding:10px 16px;margin-bottom:12px;font-size:.8rem;color:#f87171;display:flex;align-items:center;gap:8px;';
    al.innerHTML=`<i class="fas fa-triangle-exclamation" aria-hidden="true"></i> <strong>${count}</strong> doctor(es) en riesgo crítico de abandono. <a href="metricas-churn.html" style="color:#f87171;font-weight:700;text-decoration:underline;">Ver churn →</a>`;
    document.querySelector('.main,main')?.prepend(al);
  }).catch(()=>{});

  /* Realtime — notifica visualmente al operario */
  let _rtInitialized = false;
  sb.channel('operario-casos')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pedidos',filter:'negocio=eq.prodigy'}, async (payload)=>{
      if (!_rtInitialized) { _rtInitialized=true; return; } // ignorar snapshot inicial
      const p = payload.new;
      const myCase = !p.departamento_actual || _myDepts.includes(p.departamento_actual);
      if (myCase) {
        toast('🔔 Nuevo caso: '+(p.codigo||p.id?.slice(0,8)),'ok');
        if('Notification' in window && Notification.permission==='granted') {
          new Notification('PRODIGY — Nuevo caso',{body:p.codigo||'Nuevo pedido asignado',icon:'/assets/icon-192.png'});
        }
        _rtBadge(1);
      }
      await recargar();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'pedidos',filter:'negocio=eq.prodigy'}, async (payload)=>{
      const p = payload.new; const old = payload.old;
      if (p.estado !== old.estado && _myDepts.includes(p.departamento_actual)) {
        toast('↻ Caso '+(p.codigo||p.id?.slice(0,8))+' → '+p.estado,'ok');
      }
      await recargar();
    })
    .subscribe(status => { if(status==='SUBSCRIBED') _rtInitialized=true; });
  // Solicitar permiso push si no está concedido (solo si el usuario interactúa)
  if('Notification' in window && Notification.permission==='default') {
    document.addEventListener('click',function _reqNotif(){
      Notification.requestPermission();
      document.removeEventListener('click',_reqNotif);
    },{once:true});
  }
})();

function _rtBadge(delta) {
  let b = document.getElementById('rt-badge');
  if (!b) {
    b = document.createElement('span');
    b.id = 'rt-badge';
    b.style.cssText = 'position:fixed;top:56px;right:16px;background:#D946A6;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;z-index:8888;cursor:pointer;';
    b.title = 'Casos nuevos desde tu última recarga';
    b.onclick = () => { b.remove(); recargar(); };
    document.body.appendChild(b);
  }
  b.textContent = (parseInt(b.textContent||'0',10) + delta) || delta;
}

/* ── Construir tabs ── */
function buildTabs() {
  const container = document.getElementById('dept-tabs');
  _myDepts.forEach((d,i) => {
    const cfg = DEPTS[d]; if (!cfg) return;
    const btn = document.createElement('button');
    btn.className = 'dept-tab' + (i===0?' active':'');
    btn.dataset.dept = d;
    btn.innerHTML = `<i class="${cfg.icon}" style="margin-right:5px;"></i>${cfg.label}`;
    btn.style.color = cfg.color;
    btn.onclick = () => switchDept(d);
    container.appendChild(btn);
  });
  if (_myDepts.length) switchDept(_myDepts[0]);
}

function switchDept(dept) {
  _activeDept = dept;
  document.querySelectorAll('.dept-tab').forEach(t => t.classList.toggle('active', t.dataset.dept===dept));
  renderDept(dept);
}

/* ── Cargar casos ── */
async function recargar() {
  for (const dept of _myDepts) {
    const cfg = DEPTS[dept];
    const { data } = await sb.from('pedidos_operacion')
      .select('id,codigo,tipo_trabajo,material,color_vita,estado,estado_operativo,created_at,flujo,link_diseno,notas_cambios,html_diseno_url,stl_urls,construinfo_url,cambios_count,fabricacion_solicitada,fabricacion_pagada,servicios_pagados,departamento_actual,cotizacion_fab_monto,cotizacion_fab_estado,cotizacion_fab_nota,pais')
      .in('flujo', cfg.flujos)
      .not('estado','in','("cancelado","CANCELADO")')
      .order('created_at',{ascending:false})
      .limit(80);
    _casos[dept] = (data||[]).map(p => ({
      ...p, estado_operativo: p.estado_operativo||'VALIDACION_PENDIENTE'
    }));
  }
  /* Comprobantes pendientes por dept de fabricación */
  for (const dept of ['fresado','impresion']) {
    if (!_myDepts.includes(dept)) continue;
    const tiposFab = dept === 'fresado' ? ['fresado','fresado_internacional','lab'] : ['impresion','impresion_internacional'];
    const { data: comp } = await sb.from('pedidos_operacion')
      .select('id,codigo,tipo_trabajo,cotizacion_fab_monto,cotizacion_fab_nota,html_diseno_url')
      .eq('cotizacion_fab_estado','pago_enviado')
      .eq('fabricacion_pagada', false)
      .in('fabricacion_tipo', tiposFab)
      .limit(20);
    _casos['_comp_'+dept] = comp || [];
  }

  if (_activeDept) renderDept(_activeDept);
}

/* ── Render departamento ── */
function renderDept(dept) {
  const cfg  = DEPTS[dept];
  const list = _casos[dept] || [];
  const main = document.getElementById('main-content');

  /* Timer */
  const timerHtml = timerHTML(dept, list, cfg);

  /* Columnas */
  const colsHtml = cfg.cols.map(col => {
    const items = list.filter(p => col.estados.includes(p.estado_operativo));
    const cards = items.length
      ? items.map(p => cardHTML(p, col.id, dept)).join('')
      : `<p style="color:var(--muted);font-size:.8rem;padding:8px;">Sin casos</p>`;
    return `<div class="k-col">
      <div class="k-hdr" style="color:${col.color};">
        <span>${col.label}</span>
        <span class="k-count">${items.length}</span>
      </div>
      ${cards}
    </div>`;
  }).join('');

  const numCols = cfg.cols.length === 4 ? 'cols-4' : 'cols-3';

  /* Sección comprobantes pendientes para fresado/impresion */
  let compHtml = '';
  if (dept !== 'diseno' && dept !== 'taller') {
    const pendComp = (_casos['_comp_'+dept] || []);
    if (pendComp.length) {
      const fmtCOP = v => Number(v||0).toLocaleString('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0});
      compHtml = `<div style="background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);border-radius:12px;padding:14px 18px;margin-bottom:16px;">
        <div style="font-size:.72rem;font-weight:800;color:#fbbf24;margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px;">
          <i class="fas fa-receipt" style="margin-right:6px;"></i>Comprobantes pendientes de verificación (${pendComp.length})
        </div>
        ${pendComp.map(p => `<div style="background:rgba(0,0,0,.2);border-radius:9px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div style="flex:1;min-width:160px;">
            <div style="font-size:.78rem;font-weight:700;">#${esc(p.codigo||p.id.slice(0,8))} — ${esc(p.nombre_paciente||'')}</div>
            <div style="font-size:.7rem;color:var(--muted);">${esc(p.cotizacion_fab_nota||p.tipo_trabajo||'—')} · <strong style="color:#fbbf24;">${fmtCOP(p.cotizacion_fab_monto)}</strong></div>
          </div>
          ${p.html_diseno_url?`<a href="${location.origin}/revision-diseno?id=${esc(p.id)}" target="_blank" rel="noopener noreferrer" class="btn btn-dis" style="font-size:.65rem;padding:4px 9px;"><i class="fas fa-cube"></i> Ver diseño</a>`:''}
          <button type="button" class="btn btn-grn" style="font-size:.68rem;padding:5px 11px;" onclick="verificarPagoComp('${esc(p.id)}','${dept}')">
            <i class="fas fa-check"></i> Confirmar pago recibido
          </button>
        </div>`).join('')}
      </div>`;
    }
  }

  // Buscador
  const busqHtml = `<div style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
    <input type="search" id="op-busq" placeholder="🔍 Buscar código, doctor, paciente…" oninput="_opFiltrar(this.value)"
      style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 14px;color:#e2e8f0;font-size:16px;flex:1;min-width:200px;font-family:inherit;outline:none;"
      aria-label="Buscar pedidos">
    <span id="op-count" style="font-size:.75rem;color:#475569;white-space:nowrap;"></span>
  </div>`;
  main.innerHTML = timerHtml + compHtml + busqHtml + `<div id="op-kanban-wrap"><div class="kanban ${numCols}">${colsHtml}</div></div>`;
  // Contar tarjetas visibles
  const total = main.querySelectorAll('.card-pedido, [data-codigo]').length;
  const countEl = document.getElementById('op-count');
  if(countEl) countEl.textContent = total + ' pedido(s)';
}

function _opFiltrar(q) {
  const t = q.toLowerCase().trim();
  const cards = document.querySelectorAll('#op-kanban-wrap .card, #op-kanban-wrap [class*="pedido"]');
  let visible = 0;
  cards.forEach(el => {
    const show = !t || el.textContent.toLowerCase().includes(t);
    el.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const countEl = document.getElementById('op-count');
  if(countEl) countEl.textContent = (t ? visible : cards.length) + ' pedido(s)';
}

function timerHTML(dept, list, cfg) {
  const {alerta, critico} = cfg.timerHrs;
  const max = list.reduce((m, p) => {
    const h = (Date.now() - new Date(p.created_at).getTime()) / 3600000;
    return Math.max(m, h);
  }, 0);
  if (max > critico) return `<div class="timer-bar critico visible"><i class="fas fa-exclamation-triangle"></i>CRÍTICO: caso con ${Math.floor(max)}h — entrega en riesgo.</div>`;
  if (max > alerta)  return `<div class="timer-bar alerta  visible"><i class="fas fa-clock"></i>ALERTA: caso con ${Math.floor(max)}h en proceso.</div>`;
  return '';
}

/* ── Card HTML ── */
function cardHTML(p, colId, dept) {
  const cfg  = DEPTS[dept];
  const hrs  = (Date.now() - new Date(p.created_at).getTime()) / 3600000;
  const tc   = hrs > cfg.timerHrs.critico ? 'timer-critico' : hrs > cfg.timerHrs.alerta ? 'timer-alerta' : 'timer-ok';
  const tl   = `${Math.floor(hrs)}h ${Math.floor((hrs%1)*60)}m`;
  const fromDesign = p.estado_operativo === 'DISENO_FINALIZADO' && dept !== 'diseno';
  const actions = (cfg.acciones[colId]?.(p)) || '';

  return `<div class="caso-card" style="${hrs > cfg.timerHrs.critico ? 'border-color:rgba(239,68,68,.4);' : ''}">
    ${fromDesign ? `<div class="card-badge" style="background:rgba(0,210,255,.1);color:#00d2ff;border:1px solid rgba(0,210,255,.25);">✏️ Viene de Diseño</div>` : ''}
    ${p.fabricacion_solicitada && !p.fabricacion_pagada ? `<div class="card-badge" style="background:rgba(251,146,60,.1);color:#fb923c;border:1px solid rgba(251,146,60,.3);">⚙️ Fabricación solicitada — verificar pago</div>` : ''}
    ${p.fabricacion_pagada ? `<div class="card-badge" style="background:rgba(0,255,65,.1);color:#00FF41;border:1px solid rgba(0,255,65,.25);">✅ Fabricación confirmada</div>` : ''}
    <div class="card-timer ${tc}"><i class="fas fa-clock" style="margin-right:3px;"></i>${tl}</div>
    <div class="caso-id">#${esc(p.codigo)||p.id.slice(0,8)}</div>
    <div class="caso-nombre">${esc(p.nombre_paciente)||'Sin nombre'}</div>
    <div class="caso-meta">
      ${esc(p.tipo_trabajo)||'—'}
      ${p.material?'<br>'+esc(p.material):''}
      ${p.color_vita?'<br>Color: '+esc(p.color_vita):''}
      ${p.notas_cambios?'<br><span style="color:#D4AF37;">📝 '+esc(p.notas_cambios.slice(0,60))+'</span>':''}
    </div>
    <div class="caso-actions">${actions}</div>
    ${p.html_diseno_url && dept !== 'diseno' ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <a href="${location.origin}/revision-diseno?id=${esc(p.id)}" target="_blank" rel="noopener noreferrer" class="btn btn-dis" style="font-size:.65rem;padding:4px 9px;">
        <i class="fas fa-cube"></i> Ver diseño aprobado
      </a>
      ${(p.stl_urls||[]).length ? `<span style="font-size:.64rem;color:var(--muted);">${p.stl_urls.length} STL</span>` : ''}
      ${p.construinfo_url ? `<span style="font-size:.64rem;color:var(--muted);">+ construinfo</span>` : ''}
    </div>` : ''}
  </div>`;
}

/* ── Avanzar estado ── */
async function avanzar(id, nuevoEstado, dept) {
  // ── PROTOCOLO DE PAGO: verificar antes de iniciar producción ──
  const ESTADOS_REQUIEREN_PAGO = ['EN_PRODUCCION','FRESADO_INICIADO','EN_IMPRESION'];
  if (ESTADOS_REQUIEREN_PAGO.includes(nuevoEstado)) {
      const { data: pedido } = await sb.from('pedidos_operacion')
          .select('pago_estado,codigo,nombre_doctor')
          .eq('id', id).single();
      const pagoOk = pedido?.pago_estado === 'pago_confirmado';
      if (!pagoOk) {
          const forzar = confirm(
              `⚠️ ALERTA DE PAGO\n\nCaso ${pedido?.codigo || id}\nDoctor: ${pedido?.nombre_doctor || '—'}\n\nEl pago NO está confirmado (estado: ${pedido?.pago_estado || 'pendiente'}).\n\n¿Deseas iniciar producción de todas formas?\n(Solo si tienes confirmación externa del pago)`
          );
          if (!forzar) { toast('Producción cancelada — pago pendiente','err'); return; }
          // Log de excepción
          await sb.from('logs_incidencias').insert({
              pedido_id: id, tipo:'PAGO_NO_CONFIRMADO', severidad:'ADVERTENCIA',
              descripcion: `Producción iniciada sin pago_confirmado. Estado pago: ${pedido?.pago_estado}. Operario: ${_userEmail||'?'}`,
              resuelta: false
          }).catch(()=>{});
      }
  }

  const updates = { estado_operativo: nuevoEstado };
  if (nuevoEstado === 'EN_PRODUCCION')    updates.timestamp_validacion = new Date().toISOString();
  if (nuevoEstado === 'FRESADO_INICIADO') updates.timestamp_produccion  = new Date().toISOString();
  if (nuevoEstado === 'DISENO_APROBADO')  updates.estado = 'DISENO_FINALIZADO';

  const { error } = await sb.from('pedidos').update(updates).eq('id', id);
  if (error) { toast('Error: '+error.message,'err'); return; }

  /* Notificaciones automáticas por hito */
  try {
    const { data: p } = await sb.from('pedidos_operacion').select('codigo,tipo_trabajo,nombre_doctor,pais').eq('id',id).single();
    const pushUrl = SB_URL+'/functions/v1/send-push';
    const waUrl   = '/api/wa-auto';
    const heads   = {'Content-Type':'application/json','Authorization':'Bearer '+SB_ANON};
    const hCT     = {'Content-Type':'application/json'};

    const _enviarWA = (estado) => {
      if (!p?.telefono) return;
      fetch(waUrl, { method:'POST', headers:hCT, body:JSON.stringify({
        whatsapp:p.telefono, nuevo_estado:estado,
        codigo:p.codigo, nombre_doctor:p.nombre_doctor,
        pais:p.pais || 'CO', pedido_id: id
      })}).catch(()=>{});
    };

    const _enviarEmail = (tipo, asunto, texto) => {
      if (!p?.email) return;
      fetch('/api/send-email', { method:'POST', headers:hCT, body:JSON.stringify({
        to: p.email, subject: asunto, tipo, text: texto
      })}).catch(()=>{});
    };

    if (nuevoEstado === 'EN_DISENO' && p?.email) {
      await fetch(pushUrl,{method:'POST',headers:heads,
        body:JSON.stringify({email:p.email, titulo:'📋 Caso recibido en diseño',
          cuerpo:`Hola, recibimos tu caso ${p.codigo}. Nuestro equipo de diseño CAD está trabajando en él. Te notificamos cuando esté listo para revisión.`})});
    }
    if (nuevoEstado === 'REVISION_CLIENTE' && p?.email) {
      await fetch(pushUrl,{method:'POST',headers:heads,
        body:JSON.stringify({email:p.email, titulo:'👁 Diseño listo para revisión',
          cuerpo:`Caso ${p.codigo} — Tu diseño está listo. Entra a revisarlo y aprobarlo.`})});
    }
    if (nuevoEstado === 'EN_PRODUCCION') {
      _enviarWA('EN_PRODUCCION');
      if (p?.email) await fetch(pushUrl,{method:'POST',headers:heads,
        body:JSON.stringify({email:p.email, titulo:'⚙️ Caso en producción',
          cuerpo:`Caso ${p.codigo} en producción. Te avisamos cuando esté listo.`})});
    }
    if (nuevoEstado === 'DISENO_APROBADO' && p?.email) {
      const linkRevision = location.origin+'/revision-diseno?id='+id;
      await fetch(pushUrl,{method:'POST',headers:heads,
        body:JSON.stringify({email:p.email, titulo:'⬇️ Diseño aprobado — Listo para descarga',
          cuerpo:`Caso ${p.codigo}: tus archivos STL están disponibles. Descárgalos en: ${linkRevision}`})});
      await sb.from('logs_incidencias').insert({
        pedido_id: id, tipo:'TRANSICION', severidad:'INFO',
        descripcion: `Diseño aprobado → pasa a fresado/producción (Caso ${p?.codigo})`,
        resuelta: true
      });
    }
    if (nuevoEstado === 'QA_APROBADO') {
      _enviarWA('QA_APROBADO');
      _enviarEmail('pedido_confirmado', `✅ Caso ${p?.codigo} superó control de calidad`, `Hola ${p?.nombre_doctor||'Doctor'}, tu caso ${p?.codigo} pasó control de calidad y está listo para despacho.`);
      if (p?.email) await fetch(pushUrl,{method:'POST',headers:heads,
        body:JSON.stringify({email:p.email, titulo:'🎉 Caso listo para despacho',
          cuerpo:`Caso ${p.codigo} superó QA. Listo para envío.`})});
    }
    if (nuevoEstado === 'LISTO_DESPACHAR') { _enviarWA('LISTO_DESPACHAR'); _enviarEmail('diseno_listo',`📦 Caso ${p?.codigo} listo para entrega`,`Hola ${p?.nombre_doctor||'Doctor'}, tu caso está empacado y listo para despacho.`); }
    if (nuevoEstado === 'EN_REPARTO')      _enviarWA('EN_REPARTO');
    if (nuevoEstado === 'ENTREGADO')       { _enviarWA('ENTREGADO'); _enviarEmail('pedido_confirmado',`🎉 Caso ${p?.codigo} entregado`,`Hola ${p?.nombre_doctor||'Doctor'}, tu caso fue entregado exitosamente. ¡Gracias por confiar en PRODIGY!`); }
  } catch(_) { /* notificaciones no bloquean el flujo */ }

  toast('Actualizado ✓','ok');
  await recargar();
}

/* ── QA ── */
function abrirQA(id, codigo, dept) {
  const cfg = DEPTS[dept];
  document.getElementById('qa-id').value   = id;
  document.getElementById('qa-dept').value = dept;
  document.getElementById('qa-sub').textContent = 'Caso #'+codigo+' — '+cfg.label;
  document.getElementById('qa-titulo').innerHTML = `<i class="fas fa-check-double" style="margin-right:8px;color:${cfg.color}"></i>QA ${cfg.label}`;
  document.getElementById('qa-link').value  = '';
  document.getElementById('qa-notes').value = '';
  document.getElementById('qa-link-wrap').style.display = dept === 'diseno' ? 'block' : 'none';

  const checksDiv = document.getElementById('qa-checks');
  checksDiv.innerHTML = cfg.qa.map((q,i) =>
    `<div class="qa-row"><input type="checkbox" id="qc${i}"><label for="qc${i}">${q}</label></div>`
  ).join('');

  /* Mostrar/ocultar botón Cambios según el departamento */
  document.getElementById('qa-btn-cambios').style.display = dept === 'diseno' ? 'inline-flex' : 'none';
  document.getElementById('modal-qa').classList.add('open');
}

function cerrarQA() { document.getElementById('modal-qa').classList.remove('open'); }
document.getElementById('modal-qa').addEventListener('click', e => { if(e.target===document.getElementById('modal-qa')) cerrarQA(); });

async function submitQA(accion) {
  const id   = document.getElementById('qa-id').value;
  const dept = document.getElementById('qa-dept').value;
  const cfg  = DEPTS[dept];
  const link  = document.getElementById('qa-link').value.trim();
  const notes = document.getElementById('qa-notes').value.trim();

  if (accion === 'aprobar') {
    const checks = cfg.qa.map((_,i) => document.getElementById('qc'+i)?.checked);
    if (checks.some(c => !c)) { toast('Completa todos los checks antes de aprobar','err'); return; }
  }

  const nuevoEstado = accion === 'aprobar'
    ? (dept === 'diseno' ? 'DISENO_APROBADO' : 'QA_APROBADO')
    : 'CAMBIOS_SOLICITADOS';

  const updates = { estado_operativo: nuevoEstado };
  if (link)  updates.link_diseno   = link;
  if (notes) updates.notas_cambios = notes;
  if (nuevoEstado === 'DISENO_APROBADO') updates.estado = 'DISENO_FINALIZADO';
  if (nuevoEstado === 'QA_APROBADO')     updates.estado = 'QA_APROBADO';

  const { error } = await sb.from('pedidos').update(updates).eq('id', id);
  if (error) { toast('Error: '+error.message,'err'); return; }
  cerrarQA();
  toast(accion==='aprobar' ? '✅ Aprobado' : '🔄 Cambios marcados','ok');
  await recargar();
}

/* ── Subir Diseño ── */
function abrirSubirDiseno(id, codigo) {
  document.getElementById('subir-id').value = id;
  document.getElementById('subir-sub').textContent = 'Caso #'+(codigo||id.slice(0,8));
  ['up-html','up-stl','up-cinfo','up-fotos'].forEach(k => { document.getElementById(k).value=''; });
  document.getElementById('up-progress').style.display = 'none';
  document.getElementById('up-bar').style.width = '0%';
  document.getElementById('btn-subir-ok').disabled = false;
  document.getElementById('btn-subir-ok').innerHTML = '<i class="fas fa-upload"></i> Subir y enviar al doctor';
  document.getElementById('modal-subir').classList.add('open');
}
function cerrarSubirDiseno(force) {
  const tieneArchivos = document.getElementById('up-html')?.files?.length ||
                        document.getElementById('up-stl')?.files?.length ||
                        document.getElementById('up-cinfo')?.files?.length ||
                        document.getElementById('up-fotos')?.files?.length;
  if (!force && tieneArchivos) {
    abrirModalOpConfirm('🗑️', 'Descartar archivos',
      '¿Seguro que quieres cerrar? Se perderán los archivos seleccionados.',
      'Descartar', () => cerrarSubirDiseno(true));
    return;
  }
  document.getElementById('modal-subir').classList.remove('open');
}
document.getElementById('modal-subir').addEventListener('click', e => { if(e.target===document.getElementById('modal-subir')) cerrarSubirDiseno(); });

async function ejecutarSubida() {
  const id      = document.getElementById('subir-id').value;
  const htmlF   = document.getElementById('up-html').files[0];
  const stlFs   = [...document.getElementById('up-stl').files];
  const cinfoF  = document.getElementById('up-cinfo').files[0];
  const fotoFs  = [...document.getElementById('up-fotos').files];

  if (!htmlF) { toast('El visor HTML es obligatorio','err'); return; }

  // Validar magic bytes de STL, construinfo y fotos
  if (window.validateMagicBytes) {
    const filesToCheck = [...stlFs, ...(cinfoF?[cinfoF]:[]), ...fotoFs];
    for (const f of filesToCheck) {
      const mbr = await validateMagicBytes(f);
      if (!mbr.safe) { toast(mbr.error || 'Archivo no válido: '+f.name, 'err'); return; }
    }
  }

  const btn = document.getElementById('btn-subir-ok');
  btn.disabled = true;
  const progWrap = document.getElementById('up-progress');
  const bar  = document.getElementById('up-bar');
  const stat = document.getElementById('up-status');
  progWrap.style.display = 'block';

  const BUCKET = 'diseno-archivos';
  const base   = `${id}/`;
  const total  = 1 + stlFs.length + (cinfoF?1:0) + fotoFs.length;
  let done = 0;

  const updBar = msg => {
    done++;
    bar.style.width = Math.round((done/total)*100)+'%';
    stat.textContent = msg;
  };

  async function upload(path, file) {
    const { error } = await sb.storage.from(BUCKET).upload(path, file, {upsert:true});
    if (error) throw new Error('Error subiendo '+path+': '+error.message);
    const { data: signed } = await sb.storage.from(BUCKET).createSignedUrl(path, 60 * 60 * 24 * 365 * 5);
    return signed?.signedUrl || null;
  }

  try {
    stat.textContent = 'Subiendo HTML…';
    const htmlUrl = await upload(base+'diseno.html', htmlF);
    updBar('HTML OK');

    const stlUrls = [];
    for (const f of stlFs) {
      stat.textContent = 'Subiendo STL '+f.name+'…';
      const u = await upload(base+'stl/'+f.name, f);
      stlUrls.push(u);
      updBar('STL OK: '+f.name);
    }

    let cinfoUrl = null;
    if (cinfoF) {
      stat.textContent = 'Subiendo construinfo…';
      cinfoUrl = await upload(base+'construinfo/'+cinfoF.name, cinfoF);
      updBar('Construinfo OK');
    }

    const fotoUrls = [];
    for (const f of fotoFs) {
      stat.textContent = 'Subiendo foto '+f.name+'…';
      const u = await upload(base+'fotos/'+f.name, f);
      fotoUrls.push(u);
      updBar('Foto OK');
    }

    stat.textContent = 'Actualizando caso…';
    const updates = {
      html_diseno_url:   htmlUrl,
      stl_urls:          stlUrls,
      fotos_diseno_urls: fotoUrls,
      estado_operativo:  'REVISION_CLIENTE'
    };
    if (cinfoUrl) updates.construinfo_url = cinfoUrl;

    const { error: updErr } = await sb.from('pedidos').update(updates).eq('id', id);
    if (updErr) throw new Error(updErr.message);

    /* Registrar en historial */
    await sb.from('historial_diseno').insert({
      pedido_id: id, tipo:'SUBIDA_DISENO', actor:'operario',
      descripcion:`Diseño subido: HTML visor${stlUrls.length?' + '+stlUrls.length+' STL':''}${cinfoUrl?' + construinfo':''}${fotoUrls.length?' + '+fotoUrls.length+' foto(s)':''}`,
      fotos_urls: fotoUrls,
      metadata:{ html: htmlUrl, stl_count: stlUrls.length, tiene_construinfo: !!cinfoUrl }
    }).catch(()=>{});

    /* Notificar al doctor */
    try {
      const { data: p } = await sb.from('pedidos_operacion').select('codigo').eq('id',id).single();
      if (p?.email) {
        const link = location.origin+'/revision-diseno?id='+id;
        await fetch(SB_URL+'/functions/v1/send-push',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_ANON},
          body:JSON.stringify({email:p.email,
            titulo:'👁 Diseño listo — Caso '+p.codigo,
            cuerpo:'Tu diseño está listo para revisión. Haz clic para ver y aprobar: '+link})
        });
      }
    } catch(_) {}

    cerrarSubirDiseno();
    toast('Diseño subido ✓ — Link enviado al doctor','ok');
    await recargar();
  } catch(e) {
    toast('Error: '+e.message,'err');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-upload"></i> Subir y enviar al doctor';
  }
}

/* ── Enviar a siguiente departamento (handoff) ── */
async function enviarASiguiente(id, dept) {
  const LABELS = {fresado:'Fresado / Lab', impresion:'Impresión 3D', taller:'Taller'};
  const lbl = LABELS[dept] || dept;
  abrirModalOpConfirm('🏭', `Enviar a ${lbl}`,
    'El caso aparecerá en su panel con los archivos STL y de construcción disponibles.',
    'Sí, enviar',
    async () => { await _doEnviarASiguiente(id, dept, lbl); }
  );
}
async function _doEnviarASiguiente(id, dept, lbl) {
  const flujoDestino = dept === 'fresado' ? 'fresado' : dept === 'impresion' ? 'impresion' : dept;
  const { error } = await sb.from('pedidos').update({
    flujo:              flujoDestino,
    departamento_actual: dept,
    estado_operativo:  'VALIDACION_PENDIENTE'
  }).eq('id', id);
  if (error) { toast('Error: '+error.message,'err'); return; }

  /* Historial */
  await sb.from('historial_diseno').insert({
    pedido_id: id, tipo:'TRANSICION', actor:'operario',
    descripcion:`Diseño aprobado — caso enviado a ${lbl}. Archivos STL y construinfo disponibles en el panel.`
  }).catch(()=>{});

  /* Notificar al doctor */
  try {
    const { data: p } = await sb.from('pedidos_operacion').select('codigo').eq('id',id).single();
    if (p?.email) {
      await fetch(SB_URL+'/functions/v1/send-push',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_ANON},
        body:JSON.stringify({email:p.email,
          titulo:`🏭 Caso ${p.codigo} en fabricación`,
          cuerpo:`Tu diseño fue aprobado y el caso está en proceso con el equipo de ${lbl}. Te notificaremos cada avance.`})
      });
    }
  } catch(_) {}

  toast(`Caso enviado a ${lbl} ✓`,'ok');
  await recargar();
}

/* ── Verificar comprobante de pago (operario de fabricación) ── */
async function verificarPagoComp(id, dept) {
  const LABELS = {fresado:'Fresado / Lab', impresion:'Impresión 3D'};
  const lbl = LABELS[dept] || dept;
  abrirModalOpConfirm('💰', 'Confirmar pago recibido',
    `El caso pasará a tu cola de ${lbl} una vez confirmado.`,
    'Sí, recibí el pago',
    async () => { await _doVerificarPago(id, dept, lbl); }
  );
}
async function _doVerificarPago(id, dept, lbl) {
  const { error } = await sb.from('pedidos').update({
    fabricacion_pagada:    true,
    cotizacion_fab_estado: 'confirmado',
    departamento_actual:   dept,
    estado_operativo:      'VALIDACION_PENDIENTE'
  }).eq('id', id);
  if (error) { toast('Error: '+error.message,'err'); return; }

  /* Historial */
  await sb.from('historial_diseno').insert({
    pedido_id:id, tipo:'FAB_CONFIRMADA', actor:'operario',
    descripcion:`Pago verificado por operario de ${lbl}. Caso ingresa a cola de producción.`
  }).catch(()=>{});

  /* Notificar al doctor */
  try {
    const { data: p } = await sb.from('pedidos_operacion').select('codigo').eq('id',id).single();
    if (p?.email) {
      await fetch(SB_URL+'/functions/v1/send-push',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_ANON},
        body:JSON.stringify({email:p.email,
          titulo:'🏭 Pago confirmado — En fabricación',
          cuerpo:`Tu pago fue verificado. El caso ${p.codigo} está en producción con el equipo de ${lbl}. Te notificamos cada avance.`})
      });
    }
  } catch(_) {}

  toast('Pago confirmado — caso en cola ✓','ok');
  await recargar();
}

function copiarLinkRevision(id) {
  const link = location.origin+'/revision-diseno?id='+id;
  navigator.clipboard.writeText(link).then(() => toast('Link copiado ✓','ok')).catch(() => {
    toast('No se pudo copiar automáticamente. Link: ' + link, 'err');
  });
}

/* ── Modal genérico confirm ── */
let _opConfirmCb = null;
function abrirModalOpConfirm(icon, title, body, btnLabel, cb) {
  _opConfirmCb = cb;
  document.getElementById('modal-op-icon').textContent  = icon;
  document.getElementById('modal-op-title').textContent = title;
  document.getElementById('modal-op-body').textContent  = body;
  document.getElementById('modal-op-btn').textContent   = btnLabel;
  document.getElementById('modal-op-confirm').style.display = 'flex';
}
function cerrarModalOpConfirm() {
  document.getElementById('modal-op-confirm').style.display = 'none';
  _opConfirmCb = null;
}
function ejecutarOpConfirm() {
  const cb = _opConfirmCb;
  cerrarModalOpConfirm();
  if (cb) cb();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarModalOpConfirm();
});

/* ── Toast ── */
let _tt;
function toast(msg, t='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show '+t;
  clearTimeout(_tt); _tt = setTimeout(() => el.className='', 3000);
}
