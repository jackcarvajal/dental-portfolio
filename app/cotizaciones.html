<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#D946A6">
<meta name="color-scheme" content="dark">
<title>Cotizaciones — PRODIGY Lab Dental</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<style>
:root{--mg:#D946A6;--gold:#D4AF37;--cyan:#00d2ff;--neon:#00FF41;--bg:#050505;--card:#0d1520;--text:#e2e8f0;--muted:#94a3b8;--border:rgba(255,255,255,.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh;}
a{color:inherit;text-decoration:none;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.topbar h1{font-size:1rem;font-weight:800;color:var(--gold);}
.topbar a{font-size:.8rem;color:var(--muted);}
.main{max-width:1400px;margin:0 auto;padding:24px 16px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
.toolbar input[type=search]{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-size:16px;width:260px;font-family:inherit;outline:none;}
.toolbar select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:16px;cursor:pointer;font-family:inherit;outline:none;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer;border:none;font-family:inherit;transition:opacity .2s;}
.btn:hover{opacity:.85;}
.btn-primary{background:linear-gradient(135deg,var(--mg),#a0107a);color:#fff;}
.btn-green{background:rgba(0,255,65,.12);border:1px solid rgba(0,255,65,.3);color:var(--neon);}
.btn-gold{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);color:var(--gold);}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.kpi-val{font-size:1.8rem;font-weight:900;margin-bottom:4px;}
.kpi-lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:.8rem;}
th{padding:12px 14px;text-align:left;color:var(--muted);font-weight:700;font-size:.7rem;letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;}
tr:last-child td{border:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.badge{display:inline-block;padding:2px 10px;border-radius:100px;font-size:.65rem;font-weight:800;border:1px solid;}
.badge-borrador{color:#475569;border-color:#475569;background:rgba(71,85,105,.1);}
.badge-enviada{color:var(--cyan);border-color:var(--cyan);background:rgba(0,210,255,.08);}
.badge-aceptada{color:var(--neon);border-color:var(--neon);background:rgba(0,255,65,.08);}
.badge-rechazada{color:#f87171;border-color:#f87171;background:rgba(248,113,113,.08);}
.badge-expirada{color:#334155;border-color:#334155;background:rgba(51,65,85,.08);}
.dias-ok{color:var(--muted);}
.dias-warn{color:#fbbf24;font-weight:700;}
.dias-urgent{color:#f87171;font-weight:800;}
.action-btn{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;color:var(--muted);font-size:.85rem;transition:color .15s;}
.action-btn:hover{color:var(--text);}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:#0d1520;border:1px solid rgba(212,175,55,.25);border-radius:16px;padding:28px;max-width:560px;width:100%;}
.modal-box h2{font-size:1rem;font-weight:800;color:var(--gold);margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row.full{grid-template-columns:1fr;}
label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:4px;}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:16px;font-family:inherit;outline:none;}
input:focus,select:focus,textarea:focus{border-color:rgba(212,175,55,.4);}
textarea{resize:vertical;min-height:80px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.spinner{text-align:center;padding:40px;color:var(--muted);}
.empty{text-align:center;padding:48px;color:var(--muted);}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}.toolbar input[type=search]{width:100%;}}
</style>
</head>
<body>
<script src="../js/auth-guard.js?v=20260717"></script>
<script>ProdigyAuth.require(['admin','operator']);</script>
<div class="topbar">
  <a href="panel-interno-operaciones.html"><i class="fas fa-chevron-left"></i></a>
  <h1><i class="fas fa-receipt" style="color:var(--gold);margin-right:6px;"></i>Gestión de Cotizaciones</h1>
  <span style="font-size:.75rem;color:#475569;margin-left:auto;" id="ultima-act"></span>
</div>

<div class="main">
  <!-- KPIs -->
  <div class="kpi-row" id="kpi-row">
    <div class="kpi"><div class="kpi-val" style="color:var(--gold);" id="k-total">—</div><div class="kpi-lbl">Total</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--cyan);" id="k-enviadas">—</div><div class="kpi-lbl">Enviadas</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--neon);" id="k-aceptadas">—</div><div class="kpi-lbl">Aceptadas</div></div>
    <div class="kpi"><div class="kpi-val" style="color:#fbbf24;" id="k-por-vencer">—</div><div class="kpi-lbl">Por vencer 7d</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--mg);" id="k-valor">—</div><div class="kpi-lbl">Valor enviadas</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--neon);" id="k-conversion">—</div><div class="kpi-lbl">Conversión</div></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="search" id="busq" placeholder="Buscar código, doctor, tipo…" oninput="filtrar()" aria-label="Buscar cotizaciones">
    <select id="fil-estado" onchange="filtrar()">
      <option value="">Todos los estados</option>
      <option value="borrador">Borrador</option>
      <option value="enviada">Enviada</option>
      <option value="aceptada">Aceptada</option>
      <option value="rechazada">Rechazada</option>
      <option value="expirada">Expirada</option>
    </select>
    <select id="fil-tipo" onchange="filtrar()">
      <option value="">Todos los tipos</option>
      <option value="diseno">Diseño</option>
      <option value="fresado">Fresado</option>
      <option value="impresion">Impresión</option>
    </select>
    <button class="btn btn-primary" onclick="abrirModalNueva()"><i class="fas fa-plus"></i> Nueva</button>
    <button class="btn btn-gold" onclick="exportCSV()"><i class="fas fa-download"></i> CSV</button>
    <button class="btn btn-ghost" onclick="cargar()"><i class="fas fa-rotate-right"></i></button>
  </div>

  <!-- Tabla -->
  <div class="table-wrap">
    <div id="tabla-cuerpo" style="overflow-x:auto;" class="spinner"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>
  </div>
</div>

<!-- Modal nueva/editar cotización -->
<div class="modal-overlay" id="modal" style="display:none;" role="dialog" aria-modal="true" aria-label="Cotización">
  <div class="modal-box">
    <h2 id="modal-title">Nueva Cotización</h2>
    <input type="hidden" id="m-id">
    <div class="form-row">
      <div><label>Doctor / cliente</label><input type="text" id="m-doctor" placeholder="Nombre del doctor"></div>
      <div><label>Email</label><input type="email" id="m-email" placeholder="doctor@clinica.com"></div>
    </div>
    <div class="form-row">
      <div><label>WhatsApp</label><input type="tel" id="m-wa" placeholder="3001234567"></div>
      <div><label>Tipo</label>
        <select id="m-tipo">
          <option value="diseno">Diseño CAD</option>
          <option value="fresado">Fresado</option>
          <option value="impresion">Impresión 3D</option>
          <option value="otro">Otro</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div><label>Total</label><input type="number" id="m-total" placeholder="0" step="1000"></div>
      <div><label>Moneda</label>
        <select id="m-moneda">
          <option value="COP">COP</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div><label>Estado</label>
        <select id="m-estado">
          <option value="borrador">Borrador</option>
          <option value="enviada">Enviada</option>
          <option value="aceptada">Aceptada</option>
          <option value="rechazada">Rechazada</option>
        </select>
      </div>
      <div><label>Vence</label><input type="date" id="m-expira"></div>
    </div>
    <div class="form-row full">
      <div><label>Notas / detalle</label><textarea id="m-notas" placeholder="Descripción del caso, materiales, dientes…"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarCotizacion()"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.2/dist/umd/supabase.min.js" integrity="sha384-sgcvElP/LlNRtORGYFLO/9K/bENcpJK19HgvqslWXog6d8f/Va4TpltGiBlGntCM" crossorigin="anonymous"></script>
<script src="../js/supabase-client.js?v=20260603"></script>
<script>
const escH = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtCOP = (n,m) => m==='USD' ? `USD ${Number(n).toFixed(0)}` : '$'+Number(n).toLocaleString('es-CO');
const fmtD = d => d ? new Date(d).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'2-digit'}) : '—';

let _all = [];
let sb;

async function init() {
  sb = getSupabase ? getSupabase() : window.supabase?.createClient(
    'https://zgihrwqfyvgyapbwzkvw.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnaWhyd3FmeXZneWFwYnd6a3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNzczNDksImV4cCI6MjA5MDg1MzM0OX0.9CzmFDQYeQKcbtAZoT1_n_OuJ1qPVJu3jImd938T634'
  );
  await cargar();
}

async function cargar() {
  document.getElementById('tabla-cuerpo').innerHTML = '<div class="spinner"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>';
  try {
    const { data, error } = await sb.from('cotizaciones')
      .select('id,created_at,updated_at,tipo,doctor_nombre,doctor_email,doctor_tel,total,moneda,estado,expira_at,notas,negocio')
      .eq('negocio','prodigy')
      .order('created_at',{ascending:false})
      .limit(200);
    if (error) throw error;
    _all = data || [];
    renderKPIs(_all);
    filtrar();
    document.getElementById('ultima-act').textContent = 'Actualizado: '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('tabla-cuerpo').innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle" style="color:#f87171;"></i><br>${escH(e.message)}</div>`;
  }
}

function renderKPIs(data) {
  const hoy = Date.now();
  const enviadas = data.filter(c=>c.estado==='enviada');
  const aceptadas = data.filter(c=>c.estado==='aceptada');
  const porVencer = data.filter(c=>['borrador','enviada'].includes(c.estado)&&c.expira_at&&(new Date(c.expira_at)-hoy)<7*86400000&&(new Date(c.expira_at)-hoy)>0);
  const valorEnv = enviadas.reduce((s,c)=>s+Number(c.total||0),0);
  const conv = enviadas.length>0 ? Math.round(aceptadas.length/enviadas.length*100) : 0;
  document.getElementById('k-total').textContent = data.length;
  document.getElementById('k-enviadas').textContent = enviadas.length;
  document.getElementById('k-aceptadas').textContent = aceptadas.length;
  document.getElementById('k-por-vencer').textContent = porVencer.length;
  document.getElementById('k-valor').textContent = '$'+valorEnv.toLocaleString('es-CO');
  document.getElementById('k-conversion').textContent = conv+'%';
}

function filtrar() {
  const q = document.getElementById('busq').value.toLowerCase();
  const est = document.getElementById('fil-estado').value;
  const tipo = document.getElementById('fil-tipo').value;
  const rows = _all.filter(c => {
    if (est && c.estado !== est) return false;
    if (tipo && (c.tipo||'') !== tipo) return false;
    if (q) {
      const txt = [c.codigo,c.doctor,c.doctor_nombre,c.doctor_email,c.email,c.tipo,c.notas].join(' ').toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  });
  renderTabla(rows);
}

function renderTabla(rows) {
  if (!rows.length) {
    document.getElementById('tabla-cuerpo').innerHTML = '<div class="empty"><i class="fas fa-receipt"></i><br>Sin resultados</div>';
    return;
  }
  const hoy = Date.now();
  document.getElementById('tabla-cuerpo').innerHTML = `<table>
    <thead><tr>
      <th>Código</th><th>Doctor</th><th>Tipo</th><th>Total</th><th>Estado</th><th>Vence</th><th>Notas</th><th>Acciones</th>
    </tr></thead>
    <tbody>${rows.map(c => {
      const doctor = escH(c.doctor||c.doctor_nombre||c.doctor_email||c.email||'—');
      const codigo = escH(c.codigo||c.id?.slice(0,8)||'—');
      const dias = c.expira_at ? Math.ceil((new Date(c.expira_at)-hoy)/86400000) : null;
      const diasCls = dias===null?'dias-ok':dias<0?'dias-urgent':dias<=3?'dias-urgent':dias<=7?'dias-warn':'dias-ok';
      const diasLbl = dias===null?'—':dias<0?'<span class="'+diasCls+'">Vencida</span>':`<span class="${diasCls}">${dias}d</span>`;
      return `<tr>
        <td style="font-family:monospace;color:var(--cyan);">${codigo}</td>
        <td>${doctor}</td>
        <td style="text-transform:capitalize;color:var(--muted);">${escH(c.tipo||'—')}</td>
        <td style="font-weight:700;color:var(--gold);">${escH(fmtCOP(c.total,c.moneda))}</td>
        <td><span class="badge badge-${escH(c.estado||'borrador')}">${escH(c.estado||'borrador')}</span></td>
        <td>${diasLbl}</td>
        <td style="color:var(--muted);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escH(c.notas||'')}"> ${escH((c.notas||'').slice(0,40))}</td>
        <td style="white-space:nowrap;">
          <button class="action-btn" onclick="editarCotizacion('${escH(c.id)}')" title="Editar"><i class="fas fa-pen"></i></button>
          <button class="action-btn" onclick="cambiarEstado('${escH(c.id)}','aceptada')" title="Aceptar"><i class="fas fa-check" style="color:var(--neon);"></i></button>
          <button class="action-btn" onclick="enviarWA('${escH(c.id)}')" title="Enviar WA"><i class="fab fa-whatsapp" style="color:#25D366;"></i></button>
          <button class="action-btn" onclick="eliminarCotizacion('${escH(c.id)}')" title="Eliminar"><i class="fas fa-trash" style="color:#f87171;"></i></button>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function abrirModalNueva() {
  document.getElementById('m-id').value='';
  document.getElementById('m-doctor').value='';
  document.getElementById('m-email').value='';
  document.getElementById('m-wa').value='';
  document.getElementById('m-tipo').value='diseno';
  document.getElementById('m-total').value='';
  document.getElementById('m-moneda').value='COP';
  document.getElementById('m-estado').value='borrador';
  const d30=new Date(Date.now()+30*86400000); document.getElementById('m-expira').value=d30.toISOString().slice(0,10);
  document.getElementById('m-notas').value='';
  document.getElementById('modal-title').textContent='Nueva Cotización';
  document.getElementById('modal').style.display='flex';
}

function editarCotizacion(id) {
  const c=_all.find(x=>x.id===id); if(!c) return;
  document.getElementById('m-id').value=c.id;
  document.getElementById('m-doctor').value=c.doctor||c.doctor_nombre||'';
  document.getElementById('m-email').value=c.email||c.doctor_email||'';
  document.getElementById('m-wa').value=c.whatsapp||c.doctor_tel||'';
  document.getElementById('m-tipo').value=c.tipo||'diseno';
  document.getElementById('m-total').value=c.total||0;
  document.getElementById('m-moneda').value=c.moneda||'COP';
  document.getElementById('m-estado').value=c.estado||'borrador';
  document.getElementById('m-expira').value=c.expira_at?c.expira_at.slice(0,10):'';
  document.getElementById('m-notas').value=c.notas||'';
  document.getElementById('modal-title').textContent='Editar Cotización';
  document.getElementById('modal').style.display='flex';
}

function cerrarModal() { document.getElementById('modal').style.display='none'; }

async function guardarCotizacion() {
  const id=document.getElementById('m-id').value;
  const payload={
    doctor_nombre: document.getElementById('m-doctor').value.trim()||null,
    doctor_email: document.getElementById('m-email').value.trim()||null,
    doctor_tel: document.getElementById('m-wa').value.trim()||null,
    tipo: document.getElementById('m-tipo').value,
    total: Number(document.getElementById('m-total').value)||0,
    subtotal: Number(document.getElementById('m-total').value)||0,
    items: [],
    moneda: document.getElementById('m-moneda').value,
    estado: document.getElementById('m-estado').value,
    expira_at: document.getElementById('m-expira').value||null,
    notas: document.getElementById('m-notas').value.trim()||null,
    negocio: 'prodigy',
  };
  try {
    let err;
    if (id) {
      ({error:err} = await sb.from('cotizaciones').update(payload).eq('id',id));
    } else {
      ({error:err} = await sb.from('cotizaciones').insert([payload]));
    }
    if (err) throw err;
    cerrarModal();
    await cargar();
  } catch(e) { alert('Error: '+e.message); }
}

async function cambiarEstado(id, estado) {
  const {error} = await sb.from('cotizaciones').update({estado}).eq('id',id);
  if (!error) await cargar();
}

async function eliminarCotizacion(id) {
  if (!confirm('¿Eliminar esta cotización?')) return;
  await sb.from('cotizaciones').delete().eq('id',id);
  await cargar();
}

function enviarWA(id) {
  const c = _all.find(x=>x.id===id); if(!c) return;
  const wa = (c.whatsapp||c.doctor_tel||'').replace(/\D/g,'');
  if (!wa) { alert('Sin WhatsApp registrado en esta cotización.'); return; }
  const num = wa.length===10?'57'+wa:wa;
  const doctor = (c.doctor||c.doctor_nombre||'Doctor').split(' ')[0];
  const total = fmtCOP(c.total, c.moneda);
  const expira = c.expira_at ? new Date(c.expira_at).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) : '30 días';
  const msg = `💎 *PRODIGY Lab Dental*\n\nHola ${doctor}, te enviamos la cotización para tu caso de *${c.tipo||'servicio'}*.\n\n💰 *Total: ${total}*\n📅 *Válida hasta:* ${expira}\n\n${c.notas?'📋 '+c.notas+'\n\n':''}Para aprobar y generar tu pedido:\n👉 https://prodigylabdental.com/flujo-${c.tipo==='fresado'?'fresado':c.tipo==='impresion'?'impresion':'diseno'}\n\n_Respondenos este WA para cualquier consulta._`;
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');
}

function exportCSV() {
  const rows = _all.filter(c => {
    const q=document.getElementById('busq').value.toLowerCase();
    const est=document.getElementById('fil-estado').value;
    const tipo=document.getElementById('fil-tipo').value;
    if(est&&c.estado!==est)return false;
    if(tipo&&c.tipo!==tipo)return false;
    if(q){const txt=[c.codigo,c.doctor,c.doctor_nombre,c.email,c.tipo].join(' ').toLowerCase();if(!txt.includes(q))return false;}
    return true;
  });
  const header='Código,Doctor,Email,WhatsApp,Tipo,Total,Moneda,Estado,Vence,Notas,Fecha';
  const data=rows.map(c=>[
    c.codigo||c.id?.slice(0,8)||'',
    c.doctor||c.doctor_nombre||'',
    c.email||c.doctor_email||'',
    c.whatsapp||c.doctor_tel||'',
    c.tipo||'',
    c.total||0,
    c.moneda||'COP',
    c.estado||'',
    c.expira_at?c.expira_at.slice(0,10):'',
    (c.notas||'').replace(/,/g,';').replace(/\n/g,' '),
    c.created_at?c.created_at.slice(0,10):'',
  ].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
  const csv='﻿'+header+'\n'+data.join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='cotizaciones-prodigy-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal();});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))cerrarModal();});

window.addEventListener('DOMContentLoaded', init);
</script>
