<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#D946A6">
<meta name="color-scheme" content="dark">
<title>Mover Caso — PRODIGY</title>
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<style>
:root{--mg:#D946A6;--gold:#D4AF37;--cyan:#00d2ff;--neon:#00FF41;--bg:#050505;--card:#0d1520;--card2:#131d2b;--text:#e2e8f0;--muted:#94a3b8;--border:rgba(255,255,255,.1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh;visibility:hidden;padding:16px;max-width:560px;margin:0 auto;}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.hdr .logo{font-size:.8rem;font-weight:900;color:var(--gold);letter-spacing:1px;}
.hdr a{margin-left:auto;font-size:.75rem;color:var(--muted);}
.caso{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
.caso .cod{font-size:1.3rem;font-weight:900;color:var(--gold);letter-spacing:.5px;}
.caso .sub{font-size:.85rem;color:var(--muted);margin-top:2px;}
.caso .now{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:.85rem;}
.caso .now b{color:var(--cyan);}
.lbl{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px;}
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.area{padding:16px 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .12s;min-height:60px;text-align:center;}
.area:active{transform:scale(.97);}
.area.on{border-color:var(--mg);background:rgba(217,70,166,.16);color:#fff;box-shadow:0 0 0 2px rgba(217,70,166,.3);}
select,input,textarea{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:16px;font-family:inherit;outline:none;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 13px;border-radius:100px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;user-select:none;}
.chip.on{border-color:var(--gold);background:rgba(212,175,55,.16);color:var(--gold);}
.estado-row{display:flex;gap:8px;margin-top:8px;}
.est{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:.8rem;font-weight:800;cursor:pointer;font-family:inherit;text-align:center;}
.est.on-ok{border-color:var(--neon);background:rgba(0,255,65,.14);color:var(--neon);}
.est.on-warn{border-color:#fbbf24;background:rgba(251,191,36,.14);color:#fbbf24;}
.est.on-bad{border-color:#f87171;background:rgba(248,113,113,.14);color:#f87171;}
.fotos-prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.fotos-prev img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
.foto-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;border:1.5px dashed var(--border);background:var(--card);color:var(--muted);font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit;width:100%;justify-content:center;}
.save{width:100%;margin-top:20px;padding:18px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--neon),#00cc33);color:#052;font-weight:900;font-size:1.05rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;}
.save:disabled{opacity:.5;}
.hist{margin-top:22px;}
.hist h3{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.mov{display:flex;gap:10px;font-size:.82rem;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.mov .dot{color:var(--mg);}
.mov .t{color:var(--muted);white-space:nowrap;font-size:.75rem;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--neon);color:#052;font-weight:800;padding:14px 26px;border-radius:12px;font-size:.95rem;opacity:0;transition:opacity .2s;z-index:100;box-shadow:0 8px 30px rgba(0,255,65,.3);}
.toast.show{opacity:1;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
</style>
</head>
<body>
<div class="hdr"><span class="logo">💎 PRODIGY</span><a href="rastreo.html"><i class="fas fa-table-list"></i> Tablero</a></div>
<div id="app"><div class="empty"><i class="fas fa-spinner fa-spin" style="color:var(--gold)"></i> Cargando…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.2/dist/umd/supabase.min.js" integrity="sha384-sgcvElP/LlNRtORGYFLO/9K/bENcpJK19HgvqslWXog6d8f/Va4TpltGiBlGntCM" crossorigin="anonymous"></script>
<script src="../js/auth-guard.js?v=20260717"></script>
<script>ProdigyAuth.require(['admin','operator','mensajero','encargado_inventario','calidad','contabilidad','diseno','taller','fresado','impresion']);</script>
<script>
// ── EDITA AQUÍ tus áreas, técnicos y componentes reales ─────────
const AREAS = ['Recepción','Diseño CAD','Fresado','Impresión 3D','Sinterizado','Acabado','Control Calidad','Despacho','Entregado'];
const TECNICOS = ['Alejandro','Técnico 1','Técnico 2','Sin asignar'];
// Piezas físicas que pueden ir con el caso (cadena de custodia)
const COMPONENTES = ['Llave de implante','Tornillos','Análogos','Modelo/muñones','Antagonista','Aditamentos','Material (disco/resina)','Registro de mordida'];
// ────────────────────────────────────────────────────────────────
const escH = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtD = d => d ? new Date(d).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
const params = new URLSearchParams(location.search);
const CODIGO = (params.get('c')||'').trim().toUpperCase();
let sb, _ped, _seg={}, _area='', _tecnico=localStorage.getItem('pg_last_tecnico')||'', _estado='', _fotos=[];

function pickEstado(btn, kind){
  _estado = btn.dataset.e;
  document.querySelectorAll('.est').forEach(b=>{ b.className='est'; });
  btn.classList.add('on-'+kind);
}
function previewFotos(input){
  _fotos = Array.from(input.files||[]).slice(0,4);
  const prev = document.getElementById('fotosPrev');
  prev.innerHTML = _fotos.map(f=>`<img alt="foto" src="${URL.createObjectURL(f)}">`).join('');
}

async function init(){
  sb = (window.ProdigyAuth && window.ProdigyAuth.getSb) ? window.ProdigyAuth.getSb() : window.supabase.createClient(
    'https://zgihrwqfyvgyapbwzkvw.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnaWhyd3FmeXZneWFwYnd6a3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNzczNDksImV4cCI6MjA5MDg1MzM0OX0.9CzmFDQYeQKcbtAZoT1_n_OuJ1qPVJu3jImd938T634'
  );
  if(!CODIGO){ document.getElementById('app').innerHTML='<div class="empty">Sin código de caso en el QR.</div>'; return; }
  await cargar();
}

async function cargar(){
  const { data, error } = await sb.from('pedidos')
    .select('id,codigo,nombre_doctor,tipo_trabajo,estado,flujo')
    .eq('negocio','prodigy').eq('codigo', CODIGO).maybeSingle();
  if(error || !data){
    document.getElementById('app').innerHTML = `<div class="empty"><i class="fas fa-circle-question" style="color:#f87171"></i><br>No se encontró el caso <b>${escH(CODIGO)}</b>.</div>`;
    return;
  }
  _ped = data;
  const { data: seg } = await sb.from('pedido_seguimiento').select('area_actual,tecnico_actual').eq('pedido_id', _ped.id).maybeSingle();
  _seg = seg || {};
  const { data: movs } = await sb.from('pedido_movimientos').select('area,tecnico,nota,componentes,estado_recibo,fotos,por_email,created_at').eq('pedido_id', _ped.id).order('created_at',{ascending:false}).limit(8);
  render(movs||[]);
}

function render(movs){
  document.getElementById('app').innerHTML = `
    <div class="caso">
      <div class="cod">${escH(_ped.codigo)}</div>
      <div class="sub">${escH(_ped.nombre_doctor||'—')} · ${escH(_ped.tipo_trabajo||_ped.flujo||'—')}</div>
      <div class="now">Ahora en: <b>${escH(_seg.area_actual||'sin registrar')}</b>${_seg.tecnico_actual?' · con <b>'+escH(_seg.tecnico_actual)+'</b>':''}</div>
    </div>
    <div style="font-size:.74rem;color:var(--muted);background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.22);border-radius:10px;padding:9px 12px;margin:6px 0 4px;line-height:1.45;">📋 Elige el <b style="color:var(--gold)">área</b> donde está el caso ahora + tu <b style="color:var(--gold)">nombre</b> + <b style="color:var(--gold)">qué recibiste</b> + una <b style="color:var(--gold)">foto de la orden</b>, y Guarda. Repite al terminar tu etapa.</div>
    <div class="lbl">Mover a área</div>
    <div class="areas" id="areas">
      ${AREAS.map(a=>`<button class="area" data-a="${escH(a)}" onclick="pickArea(this)">${escH(a)}</button>`).join('')}
    </div>
    <div class="lbl">Técnico que lo recibe</div>
    <select id="tecnico" onchange="_tecnico=this.value">
      ${TECNICOS.map(t=>`<option value="${escH(t)}"${t===_tecnico?' selected':''}>${escH(t)}</option>`).join('')}
    </select>
    <div class="lbl">¿Qué recibe con el caso?</div>
    <div class="chips" id="chips">
      ${COMPONENTES.map(c=>`<div class="chip" data-c="${escH(c)}" onclick="this.classList.toggle('on')">${escH(c)}</div>`).join('')}
    </div>
    <div class="estado-row">
      <button type="button" class="est" data-e="completo" onclick="pickEstado(this,'ok')">✔ Completo</button>
      <button type="button" class="est" data-e="incompleto" onclick="pickEstado(this,'bad')">✖ Falta algo</button>
      <button type="button" class="est" data-e="con_observaciones" onclick="pickEstado(this,'warn')">⚠ Con obs.</button>
    </div>
    <div class="lbl">Foto — toma foto de la ORDEN (respaldo si se pierde el papel)</div>
    <label class="foto-btn"><i class="fas fa-camera"></i> Tomar / adjuntar foto de la orden
      <input id="fotoInput" type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="previewFotos(this)">
    </label>
    <div class="fotos-prev" id="fotosPrev"></div>
    <div class="lbl">Nota (opcional)</div>
    <input id="nota" type="text" placeholder="Ej: falta tornillo, urgente, reproceso…" maxlength="120">
    <button class="save" id="btnSave" onclick="guardar()" disabled><i class="fas fa-check"></i> Guardar movimiento</button>
    <div class="hist">
      <h3>Últimos movimientos</h3>
      ${movs.length ? movs.map(m=>`<div class="mov"><span class="dot">●</span><div><b>${escH(m.area||'—')}</b>${m.tecnico?' · '+escH(m.tecnico):''}${m.estado_recibo?' · <span style="color:'+(m.estado_recibo==='completo'?'var(--neon)':m.estado_recibo==='incompleto'?'#f87171':'#fbbf24')+'">'+escH(m.estado_recibo.replace('_',' '))+'</span>':''}${m.componentes?'<br><span style="color:var(--muted)">🔑 '+escH(m.componentes)+'</span>':''}${m.nota?'<br><span style="color:var(--muted)">'+escH(m.nota)+'</span>':''}${m.fotos&&m.fotos.length?'<br><span style="color:var(--cyan);font-size:.72rem">📷 '+m.fotos.length+' foto(s)</span>':''}${m.por_email?'<br><span style="color:#475569;font-size:.68rem">por '+escH(m.por_email)+'</span>':''}</div><span class="t" style="margin-left:auto">${escH(fmtD(m.created_at))}</span></div>`).join('') : '<div style="color:var(--muted);font-size:.82rem">Sin movimientos aún.</div>'}
    </div>`;
  if(!_tecnico && TECNICOS.length){ _tecnico = document.getElementById('tecnico').value; }
}

function pickArea(btn){
  _area = btn.dataset.a;
  document.querySelectorAll('.area').forEach(b=>b.classList.toggle('on', b===btn));
  document.getElementById('btnSave').disabled = false;
}

async function guardar(){
  if(!_area){ return; }
  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando…';
  const nota = (document.getElementById('nota').value||'').trim() || null;
  const email = window.PRODIGY_EMAIL || null;
  const componentes = Array.from(document.querySelectorAll('.chip.on')).map(c=>c.dataset.c).join(', ') || null;
  localStorage.setItem('pg_last_tecnico', _tecnico||'');
  try{
    // Subir fotos (opcional) al bucket privado caso-fotos
    let fotoPaths = [];
    if(_fotos.length){
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo fotos…';
      for(let i=0;i<_fotos.length;i++){
        const f=_fotos[i];
        const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').slice(0,5);
        const path=`${_ped.codigo}/${Date.now()}_${i}.${ext}`;
        const { error:eu } = await sb.storage.from('caso-fotos').upload(path, f, {upsert:false});
        if(!eu) fotoPaths.push(path);
      }
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando…';
    }
    const { error: e1 } = await sb.from('pedido_movimientos').insert({
      pedido_id:_ped.id, codigo:_ped.codigo, negocio:'prodigy', accion:'movimiento',
      area:_area, tecnico:_tecnico||null, nota, por_email:email,
      componentes, estado_recibo:_estado||null, fotos: fotoPaths.length?fotoPaths:null
    });
    if(e1) throw e1;
    await sb.from('pedido_seguimiento').upsert({ pedido_id:_ped.id, codigo:_ped.codigo, negocio:'prodigy', area_actual:_area, tecnico_actual:_tecnico||null, updated_at:new Date().toISOString() }, { onConflict:'pedido_id' });
    toast('✓ Guardado: '+_area);
    _area=''; _estado=''; _fotos=[];
    await cargar();
  }catch(e){
    alert('No se pudo guardar: '+(e.message||e));
    btn.disabled=false; btn.innerHTML='<i class="fas fa-check"></i> Guardar movimiento';
  }
}

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
