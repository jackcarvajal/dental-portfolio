<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#D946A6">
<title>Reportes de la web — PRODIGY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<style>
/* Identidad PRODIGY (CLAUDE.md §5 + ESTANDARES-UX-TIPOGRAFIA.md): Inter · magenta · oro · cian · neón · #050505 */
:root{--mg:#D946A6;--gold:#D4AF37;--cy:#00d2ff;--neon:#00FF41;--bg:#050505;--card:#0d1520;--card2:#1a2332;--tx:#f0f0f5;--mu:#b0b0b8;--mu2:#94a3b8;--line:rgba(255,255,255,.1);--red:#ef4444}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;visibility:hidden;background:var(--bg);color:var(--tx);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:1rem;line-height:1.6}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--mg),var(--gold) 50%,var(--cy));z-index:5}
.wrap{max-width:1260px;margin:0 auto;padding:28px 24px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--mu);text-decoration:none;font-size:.9rem;font-weight:600;padding:9px 16px;border:1px solid var(--line);border-radius:50px}
.back:hover{color:#fff;border-color:rgba(217,70,166,.5)}
.brand{font-weight:900;letter-spacing:.3em;font-size:.85rem;background:linear-gradient(90deg,var(--mg),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-weight:900;font-size:clamp(1.8rem,4vw,2.4rem);letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.head h1 span{background:linear-gradient(90deg,var(--mg),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{color:var(--mu);font-size:1rem;margin-top:8px;max-width:600px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:118px;background:var(--card)}
.stat b{display:block;font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.78rem;font-weight:700;color:var(--mu2)}
.stat.mg b{color:var(--mg)}.stat.cy b{color:var(--cy)}.stat.gold b{color:var(--gold)}.stat.neon b{color:var(--neon)}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:50px;padding:4px;background:var(--card)}
.seg button{background:none;border:none;color:var(--mu);font-family:inherit;font-size:.88rem;font-weight:600;padding:7px 14px;border-radius:50px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(217,70,166,.18);color:#fff}
.bar select,.bar input{background:var(--card);border:1px solid rgba(255,255,255,.15);color:var(--tx);border-radius:50px;padding:10px 16px;font-family:inherit;font-size:.95rem}
.bar input{flex:1;min-width:200px}
.bar input::placeholder{color:rgba(255,255,255,.5)}
.bar select option{background:#0d1520}
.bar input:focus,.bar select:focus{outline:2px solid var(--mg);box-shadow:0 0 0 4px rgba(217,70,166,.2)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:inherit;font:inherit;cursor:pointer}
.row:hover{border-color:rgba(0,210,255,.35)}
.row[aria-current="true"]{border-color:var(--mg);box-shadow:0 0 0 3px rgba(217,70,166,.15)}
.row .f{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);font-size:.95rem}
.row .t{min-width:0}
.row .d{font-size:.97rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:.85rem;color:var(--mu2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:800;border-radius:50px;padding:3px 11px;border:1px solid currentColor;white-space:nowrap}
.pill.nuevo{color:var(--mg)}.pill.en_revision{color:var(--cy)}.pill.resuelto{color:var(--neon)}.pill.descartado{color:var(--mu2)}
.tag{font-size:.8rem;color:var(--mu2);white-space:nowrap}
.tag.auto{color:var(--gold)}.tag.ia{color:var(--neon)}.tag.hablando{color:var(--cy)}
.x2{font-variant-numeric:tabular-nums;font-size:.75rem;font-weight:800;color:var(--gold);border:1px solid rgba(212,175,55,.45);border-radius:6px;padding:0 6px}

.det{position:sticky;top:18px;background:linear-gradient(165deg,var(--card2),var(--card) 60%);border:1px solid rgba(0,210,255,.2);border-radius:20px;padding:22px;max-height:calc(100vh - 36px);overflow-y:auto}
.det .vacio{color:var(--mu);text-align:center;padding:44px 10px}
.det h2{font-weight:900;font-size:1.3rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.2}
.det h2 .fo{color:var(--gold)}
.det .cerrar{display:none}
.det .desc{margin:16px 0;font-size:1rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 12px;font-size:.92rem;margin:14px 0}
.kv dt{color:var(--mu2);font-size:.85rem;font-weight:700}
.kv dd{word-break:break-word}
.kv a{color:var(--cy)}
.lb{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:#c0c0c8;margin:20px 0 8px}
.lb i{color:var(--cy)}
.cap{display:block;width:100%;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}
.migas{list-style:none;font-size:.8rem;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.migas li{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);display:grid;grid-template-columns:40px 70px minmax(0,1fr);gap:8px;word-break:break-word;color:#c0c0c8}
.migas li:last-child{border-bottom:none}
.migas .k{color:var(--mu2)}.migas .k.error,.migas .k.promesa{color:var(--mg)}.migas .k.red{color:var(--cy)}
.pila{white-space:pre-wrap;word-break:break-word;font-size:.8rem;font-family:ui-monospace,Consolas,monospace;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:10px;color:#c0c0c8;max-height:170px;overflow:auto}
.chat{display:flex;flex-direction:column;gap:8px}
.bb{max-width:94%;border-radius:14px;padding:10px 14px;font-size:.92rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bb.ia{align-self:flex-start;background:rgba(0,210,255,.07);border:1px solid rgba(0,210,255,.25)}
.bb.yo{align-self:flex-end;background:rgba(217,70,166,.12);border:1px solid rgba(217,70,166,.32)}
.bb strong{color:#fff}.bb a{color:var(--cy);word-break:break-all}
.ana{background:rgba(0,210,255,.05);border:1px solid rgba(0,210,255,.25);border-radius:14px;padding:14px 16px;font-size:.93rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ana strong{color:#fff}
.det textarea{width:100%;min-height:96px;background:rgba(10,22,40,.85);border:1px solid rgba(255,255,255,.15);border-radius:14px;color:var(--tx);padding:12px 16px;font-family:inherit;font-size:1rem;line-height:1.55;resize:vertical}
.det textarea::placeholder{color:rgba(255,255,255,.5)}
.det textarea:focus{outline:2px solid var(--mg);box-shadow:0 0 0 4px rgba(217,70,166,.2);border-color:transparent}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:50px;padding:10px 20px;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);text-decoration:none}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn.mg{background:linear-gradient(135deg,var(--mg),#9c27b0);border:none;color:#fff}
.btn.ok{color:var(--neon);border-color:rgba(0,255,65,.45);background:rgba(0,255,65,.06)}
.btn.rev{color:var(--cy);border-color:rgba(0,210,255,.45);background:rgba(0,210,255,.06)}
.btn.ia{background:linear-gradient(135deg,var(--cy),var(--mg));border:none;color:#050505}
.btn.wa i{color:#25D366}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,.row:focus-visible,.seg button:focus-visible,.back:focus-visible{outline:2px solid #fff;outline-offset:2px}
.empty{color:var(--mu);text-align:center;padding:54px 12px;border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid rgba(217,70,166,.5);color:#fff;padding:12px 20px;border-radius:50px;font-size:.92rem;font-weight:600;z-index:99999;display:none}

@media(max-width:1000px){
  .grid{grid-template-columns:1fr}
  .det{display:none;position:fixed;inset:0;top:0;max-height:none;border-radius:0;z-index:99995;background:var(--bg);padding:20px 16px 40px;border:none}
  .det.abierto{display:block}
  .det .cerrar{display:inline-flex;margin-bottom:14px}
}
@media(max-width:560px){
  .wrap{padding:20px 16px 40px}
  .row{grid-template-columns:52px minmax(0,1fr)}
  .row .r{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}
  .stat{min-width:0;flex:1 1 40%}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="panel-interno-operaciones.html"><i class="fas fa-arrow-left"></i> Panel</a>
    <span class="brand">PRODIGY</span>
  </div>

  <div class="head">
    <div>
      <h1>Reportes <span>de la web</span></h1>
      <p>Lo que operarios, doctores y visitantes reportan con «¿Algo falla?», lo que el asistente IA resolvió solo y los errores que la web detecta sin que nadie avise.</p>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </div>

  <div class="bar">
    <div class="seg" id="fEstado" role="group" aria-label="Estado">
      <button type="button" data-v="abiertos" aria-pressed="true">Abiertos</button>
      <button type="button" data-v="resuelto" aria-pressed="false">Resueltos</button>
      <button type="button" data-v="descartado" aria-pressed="false">Descartados</button>
      <button type="button" data-v="todos" aria-pressed="false">Todos</button>
    </div>
    <div class="seg" id="fOrigen" role="group" aria-label="Origen">
      <button type="button" data-v="todos" aria-pressed="true">Todo</button>
      <button type="button" data-v="usuario" aria-pressed="false">Personas</button>
      <button type="button" data-v="automatico" aria-pressed="false">Automáticos</button>
    </div>
    <select id="fTipo" aria-label="Tipo">
      <option value="">Todos los tipos</option>
      <option value="archivos">Subir archivos</option>
      <option value="pagos">Pagos</option>
      <option value="no_carga">Algo no carga</option>
      <option value="datos">Datos incorrectos</option>
      <option value="sugerencia">Sugerencia</option>
      <option value="otro">Otro</option>
      <option value="error_js">Error automático</option>
    </select>
    <input id="fQ" type="search" placeholder="Buscar por texto, página, correo o R-número" aria-label="Buscar">
  </div>

  <div class="grid">
    <div class="list" id="list" aria-live="polite"></div>
    <aside class="det" id="det" aria-live="polite"><div class="vacio">Elige un reporte para ver el detalle.</div></aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.2/dist/umd/supabase.min.js" integrity="sha384-sgcvElP/LlNRtORGYFLO/9K/bENcpJK19HgvqslWXog6d8f/Va4TpltGiBlGntCM" crossorigin="anonymous"></script>
<script src="../js/auth-guard.js?v=20260924"></script>
<script>
(function(){
  /* ── CONFIG (único bloque que cambia entre repos) ── */
  var NEGOCIO = 'prodigy', SITIO = 'https://prodigylabdental.com', ROLES = ['admin','operator','secretaria'];
  /* ─────────────────────────────────────────────── */
  var TIPO = { archivos:'Subir archivos', pagos:'Pagos', no_carga:'Algo no carga', datos:'Datos incorrectos', sugerencia:'Sugerencia', otro:'Otro', error_js:'Error automático' };
  var EST = { nuevo:'Nuevo', en_revision:'En revisión', resuelto:'Resuelto', descartado:'Descartado' };
  var ROWS = [], CUR = null, sb = null, ANALIZANDO = null;
  var F = { estado:'abiertos', origen:'todos', tipo:'', q:'' };
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var norm = function(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); };
  // Texto de IA → HTML seguro: todo escapado; solo **negrita** y enlaces https
  var fmt = function(t){ return esc(t).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/https:\/\/[^\s<]+/g, function(u){ var m = u.match(/(&quot;.*|[.,;:!?)]+)$/), r = m ? m[0] : ''; if (r) u = u.slice(0, -r.length); return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>' + r; }); };

  function hace(iso){
    var s = (Date.now() - new Date(iso).getTime())/1000;
    if (s < 60) return 'hace un momento';
    if (s < 3600) return 'hace ' + Math.round(s/60) + ' min';
    if (s < 86400) return 'hace ' + Math.round(s/3600) + ' h';
    if (s < 86400*7) return 'hace ' + Math.round(s/86400) + ' d';
    return new Date(iso).toLocaleDateString('es-CO', { day:'numeric', month:'short' });
  }
  function toast(t){ var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function(){ e.style.display = 'none'; }, 2600); }
  function quien(r){ return r.email || r.contacto || (r.origen === 'automatico' ? 'Visitante' : 'Sin sesión'); }

  function stats(){
    var c = function(f){ return ROWS.filter(f).length; };
    var mes = Date.now() - 30*86400000;
    var items = [
      ['mg', c(function(r){ return r.estado === 'nuevo' && r.origen === 'usuario'; }), 'Nuevos'],
      ['cy', c(function(r){ return r.estado === 'en_revision'; }), 'En revisión'],
      ['gold', c(function(r){ return r.origen === 'automatico' && (r.estado === 'nuevo' || r.estado === 'en_revision'); }), 'Errores automáticos'],
      ['neon', c(function(r){ return r.resuelto_por_ia && new Date(r.resuelto_at || r.updated_at).getTime() > mes; }), 'Resueltos por IA · 30 d']
    ];
    $('stats').innerHTML = items.map(function(i){ return '<div class="stat ' + i[0] + '"><b>' + i[1] + '</b><span>' + i[2] + '</span></div>'; }).join('');
  }

  function filtrados(){
    var q = norm(F.q.replace(/^r-?/i, ''));
    return ROWS.filter(function(r){
      if (F.estado === 'abiertos' && !(r.estado === 'nuevo' || r.estado === 'en_revision')) return false;
      if (F.estado !== 'abiertos' && F.estado !== 'todos' && r.estado !== F.estado) return false;
      if (F.origen !== 'todos' && r.origen !== F.origen) return false;
      if (F.tipo && r.tipo !== F.tipo) return false;
      if (q && norm([r.folio, r.descripcion, r.pagina, r.email, r.contacto, r.rol].join(' ')).indexOf(q) < 0) return false;
      return true;
    });
  }

  function etiquetas(r){
    var t = '';
    if (r.origen === 'automatico') t += '<span class="tag auto">Automático</span> ';
    if (r.veces > 1) t += '<span class="x2">×' + esc(r.veces) + '</span> ';
    if (r.resuelto_por_ia) t += '<span class="tag ia"><i class="fas fa-wand-magic-sparkles"></i> IA</span> ';
    else if (r.aviso_pendiente) t += '<span class="tag hablando"><i class="fas fa-comments"></i> con la IA</span> ';
    if (r.captura_url) t += '<i class="fas fa-image tag" title="Con captura"></i> ';
    return t;
  }

  function pintarLista(){
    var L = filtrados();
    if (!L.length) { $('list').innerHTML = '<div class="empty">' + (ROWS.length ? 'Nada con estos filtros.' : 'Todavía no hay reportes. Cuando alguien use «¿Algo falla?» aparecerá aquí.') + '</div>'; return; }
    $('list').innerHTML = L.map(function(r){
      var pag = (r.pagina || '').split('?')[0];
      return '<button type="button" class="row" data-id="' + esc(r.id) + '"' + (CUR === r.id ? ' aria-current="true"' : '') + '>'
        + '<span class="f">R-' + esc(r.folio) + '</span>'
        + '<span class="t"><div class="d">' + esc(r.descripcion || '(sin texto, con captura)') + '</div>'
        + '<div class="m">' + esc(TIPO[r.tipo] || r.tipo) + ' · ' + esc(pag) + ' · ' + esc(quien(r)) + '</div></span>'
        + '<span class="r"><span class="pill ' + esc(r.estado) + '">' + esc(EST[r.estado] || r.estado) + '</span>'
        + '<span class="tag">' + etiquetas(r) + esc(hace(r.created_at)) + '</span></span>'
        + '</button>';
    }).join('');
  }

  function pintarDetalle(){
    var r = ROWS.find(function(x){ return x.id === CUR; });
    var d = $('det');
    if (!r) { d.classList.remove('abierto'); d.innerHTML = '<div class="vacio">Elige un reporte para ver el detalle.</div>'; return; }
    var ctx = r.contexto || {};
    var pag = r.pagina || '';
    var h = '<button type="button" class="btn cerrar" id="dCerrar"><i class="fas fa-arrow-left"></i> Volver a la lista</button>'
      + '<h2><span class="fo">R-' + esc(r.folio) + '</span> <span class="pill ' + esc(r.estado) + '">' + esc(EST[r.estado] || r.estado) + '</span>'
      + (r.origen === 'automatico' ? '<span class="tag auto">Detectado por la web' + (r.veces > 1 ? ' · pasó ' + esc(r.veces) + ' veces' : '') + '</span>' : '')
      + (r.resuelto_por_ia ? '<span class="tag ia"><i class="fas fa-wand-magic-sparkles"></i> Resuelto por la IA</span>' : '') + '</h2>'
      + '<div class="desc">' + esc(r.descripcion || '(sin texto)') + '</div>'
      + '<dl class="kv">'
      + '<dt>Tipo</dt><dd>' + esc(TIPO[r.tipo] || r.tipo) + '</dd>'
      + '<dt>Página</dt><dd><a href="' + esc(pag.charAt(0) === '/' ? SITIO + pag : '#') + '" target="_blank" rel="noopener noreferrer">' + esc(pag) + '</a></dd>'
      + '<dt>Quién</dt><dd>' + esc(quien(r)) + (r.rol ? ' <span class="tag">(' + esc(r.rol) + ')</span>' : '') + '</dd>'
      + '<dt>Cuándo</dt><dd>' + esc(new Date(r.created_at).toLocaleString('es-CO', { dateStyle:'medium', timeStyle:'short' })) + '</dd>'
      + '<dt>Equipo</dt><dd>' + esc([r.dispositivo, r.pantalla, ctx.conexion && ctx.conexion !== 'ok' ? 'red: ' + ctx.conexion : ''].filter(Boolean).join(' · ')) + '</dd>'
      + '<dt>Navegador</dt><dd class="tag" style="white-space:normal">' + esc(r.navegador || '—') + '</dd>'
      + '</dl>';
    if (r.captura_url) h += '<span class="lb"><i class="fas fa-image"></i> Captura</span><a id="capLink" target="_blank" rel="noopener noreferrer"><img class="cap" id="cap" alt="Captura enviada con el reporte"></a>';
    if (Array.isArray(r.chat_ia) && r.chat_ia.length > 1) {
      h += '<span class="lb"><i class="fas fa-comments"></i> Conversación con el asistente</span><div class="chat">'
        + r.chat_ia.slice(1).map(function(m){ return '<div class="bb ' + (m.role === 'user' ? 'yo' : 'ia') + '">' + (m.role === 'user' ? esc(m.content) : fmt(m.content)) + '</div>'; }).join('') + '</div>';
    }
    if (ctx.detalle) h += '<span class="lb"><i class="fas fa-circle-info"></i> Detalle de la página</span><div class="pila">' + esc(typeof ctx.detalle === 'string' ? ctx.detalle : JSON.stringify(ctx.detalle, null, 1)) + '</div>';
    if (ctx.errores && ctx.errores.length) {
      h += '<span class="lb"><i class="fas fa-list-ul"></i> Lo que pasó antes (técnico)</span><ul class="migas">' + ctx.errores.map(function(e){
        return '<li><span class="k">' + esc(e.t) + '</span><span class="k ' + esc(e.k) + '">' + esc(e.k) + '</span><span>' + esc(e.msg) + (e.donde ? ' <span class="k">' + esc(e.donde) + '</span>' : '') + '</span></li>';
      }).join('') + '</ul>';
    }
    if (ctx.donde || ctx.pila) h += '<span class="lb"><i class="fas fa-code"></i> Dónde falló el código</span><div class="pila">' + esc([ctx.donde, ctx.pila].filter(Boolean).join('\n')) + '</div>';
    h += '<span class="lb"><i class="fas fa-wand-magic-sparkles"></i> Análisis con IA</span>'
      + '<div class="ana" id="dAna"' + (r.analisis_ia ? '' : ' hidden') + '>' + fmt(r.analisis_ia || '') + '</div>'
      + '<div class="acts"><button type="button" class="btn ia" id="dAnalizar"><i class="fas fa-wand-magic-sparkles"></i> ' + (r.analisis_ia ? 'Analizar de nuevo' : 'Analizar con IA') + '</button>'
      + '<button type="button" class="btn" id="dUsar"' + (sugerida(r.analisis_ia) ? '' : ' hidden') + '><i class="fas fa-reply"></i> Usar respuesta sugerida</button></div>';
    h += '<label class="lb" for="dResp"><i class="fas fa-pen"></i> Respuesta</label>'
      + '<textarea id="dResp" placeholder="Qué se hizo o qué debe hacer la persona. ' + (r.user_id ? 'La verá en «Tus reportes» del mismo botón.' : 'No tiene sesión: respóndele por su contacto.') + '">' + esc(r.respuesta || '') + '</textarea>'
      + '<div class="acts">'
      + '<button type="button" class="btn ok" data-e="resuelto"><i class="fas fa-check"></i> Resuelto</button>'
      + '<button type="button" class="btn rev" data-e="en_revision"><i class="fas fa-magnifying-glass"></i> En revisión</button>'
      + '<button type="button" class="btn" data-e="descartado">Descartar</button>'
      + '<button type="button" class="btn mg" data-e=""><i class="fas fa-floppy-disk"></i> Guardar respuesta</button>'
      + '</div>';
    var tel = String(r.contacto || '').replace(/\D/g, '');
    var mail = r.email || (/@/.test(r.contacto || '') ? r.contacto : '');
    var txt = 'Hola, sobre tu reporte R-' + r.folio + ' en la web: ';
    if (tel.length >= 10 || mail) {
      h += '<div class="acts">';
      if (tel.length >= 10) h += '<a class="btn wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/' + esc(tel) + '?text=' + encodeURIComponent(txt) + '"><i class="fab fa-whatsapp"></i> WhatsApp</a>';
      if (mail) h += '<a class="btn" href="mailto:' + esc(mail) + '?subject=' + encodeURIComponent('Tu reporte R-' + r.folio) + '&body=' + encodeURIComponent(txt) + '"><i class="fas fa-envelope"></i> Correo</a>';
      h += '</div>';
    }
    d.innerHTML = h;
    d.classList.add('abierto');
    $('dCerrar').onclick = function(){ CUR = null; pintarDetalle(); pintarLista(); };
    d.querySelectorAll('[data-e]').forEach(function(b){ b.onclick = function(){ guardar(r, b.getAttribute('data-e')); }; });
    $('dAnalizar').onclick = function(){ analizar(r); };
    $('dUsar').onclick = function(){ var s = sugerida(r.analisis_ia); if (s) { $('dResp').value = s; $('dResp').focus(); toast('Respuesta sugerida copiada: revísala y guarda'); } };
    if (r.captura_url) sb.storage.from('reportes-capturas').createSignedUrl(r.captura_url, 900).then(function(res){
      if (res.data && res.data.signedUrl && $('cap')) { $('cap').src = res.data.signedUrl; $('capLink').href = res.data.signedUrl; }
    });
  }

  function sugerida(t){
    var i = String(t || '').indexOf('RESPUESTA SUGERIDA:');
    return i < 0 ? '' : t.slice(i + 19).replace(/^\s*[\(\[]?|[\)\]]?\s*$/g, '').trim();
  }

  function analizar(r){
    if (ANALIZANDO) return;
    ANALIZANDO = r.id;
    var btn = $('dAnalizar'), box = $('dAna');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analizando…';
    box.hidden = false; box.textContent = '';
    var texto = '';
    sb.auth.getSession().then(function(s){
      var t = s && s.data && s.data.session && s.data.session.access_token;
      return fetch('/api/asistente-soporte', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + t }, body: JSON.stringify({ modo:'equipo', id:r.id }) });
    }).then(function(res){
      if (!res.ok || !res.body) return res.json().catch(function(){ return {}; }).then(function(j){
        throw new Error(j.error === 'asistente_no_configurado' ? 'Falta la clave de IA (GEMINI_API_KEY) en Cloudflare.' : (j.error || 'Error ' + res.status));
      });
      var rd = res.body.getReader(), dec = new TextDecoder();
      return (function leer(){ return rd.read().then(function(p){
        if (p.done) return;
        texto += dec.decode(p.value, { stream:true });
        if (CUR === r.id && $('dAna')) { $('dAna').innerHTML = fmt(texto); }
        return leer();
      }); })();
    }).then(function(){
      r.analisis_ia = texto;
      if (CUR === r.id) pintarDetalle();
    }).catch(function(e){
      if (CUR === r.id && $('dAna')) $('dAna').textContent = 'No se pudo analizar: ' + e.message;
      if (CUR === r.id && $('dAnalizar')) { $('dAnalizar').disabled = false; $('dAnalizar').innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Analizar con IA'; }
    }).then(function(){ ANALIZANDO = null; });
  }

  function guardar(r, estado){
    var cambios = { respuesta: $('dResp').value.trim() || null, updated_at: new Date().toISOString() };
    if (estado) {
      cambios.estado = estado;
      cambios.resuelto_at = (estado === 'resuelto' || estado === 'descartado') ? new Date().toISOString() : null;
      cambios.aviso_pendiente = false;
    }
    sb.from('reportes_web').update(cambios).eq('id', r.id).then(function(res){
      if (res.error) { toast('No se guardó: ' + res.error.message); return; }
      Object.assign(r, cambios);
      toast(estado ? 'Marcado como ' + EST[estado].toLowerCase() : 'Respuesta guardada');
      stats(); pintarLista(); pintarDetalle();
    });
  }

  function cargar(){
    return sb.from('reportes_web')
      .select('id,folio,created_at,updated_at,origen,tipo,descripcion,pagina,user_id,email,rol,contacto,navegador,dispositivo,pantalla,contexto,captura_url,veces,estado,respuesta,resuelto_at,aviso_pendiente,resuelto_por_ia,chat_ia,analisis_ia')
      .eq('negocio', NEGOCIO)
      .order('created_at', { ascending:false }).limit(400)
      .then(function(res){
        if (res.error) { $('list').innerHTML = '<div class="empty">No se pudieron leer los reportes: ' + esc(res.error.message) + '</div>'; return; }
        ROWS = res.data || [];
        // No repintar el detalle si se está escribiendo una respuesta o corre un análisis
        var dr = $('dResp'), act = CUR && ROWS.find(function(x){ return x.id === CUR; });
        var sucio = dr && act && (act.respuesta || '') !== dr.value.trim();
        stats(); pintarLista(); if (!ANALIZANDO && !sucio) pintarDetalle();
      });
  }

  function seg(id, key){
    $(id).addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      F[key] = b.getAttribute('data-v');
      $(id).querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      pintarLista();
    });
  }

  ProdigyAuth.require(ROLES).then(function(u){
    if (!u) return;
    sb = ProdigyAuth.getSb();
    seg('fEstado', 'estado'); seg('fOrigen', 'origen');
    $('fTipo').onchange = function(){ F.tipo = this.value; pintarLista(); };
    $('fQ').oninput = function(){ F.q = this.value; pintarLista(); };
    $('list').addEventListener('click', function(e){
      var b = e.target.closest('.row'); if (!b) return;
      CUR = b.getAttribute('data-id'); pintarLista(); pintarDetalle();
    });
    var m = location.hash.match(/^#R-?(\d+)$/i);
    cargar().then(function(){
      if (m) { var r = ROWS.find(function(x){ return String(x.folio) === m[1]; }); if (r) { CUR = r.id; F.estado = 'todos'; $('fEstado').querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === 'todos')); }); pintarLista(); pintarDetalle(); } }
    });
    setInterval(function(){ if (!document.hidden && !ANALIZANDO) cargar(); }, 60000);
  });
})();
</script>
</body>
</html>
