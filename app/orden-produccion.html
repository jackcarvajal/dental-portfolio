<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Orden de Producción — PRODIGY</title>
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--mg:#D946A6;--gold:#B8901F;--ink:#111;--soft:#666;}
body{background:#e2e8f0;color:var(--ink);font-family:-apple-system,'Segoe UI',Arial,sans-serif;padding:16px;visibility:hidden;}
.bar{max-width:275mm;margin:0 auto 12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
.bar button,.bar a{padding:11px 20px;border-radius:9px;border:none;font-weight:800;font-size:.85rem;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px;}
.print{background:var(--mg);color:#fff;}.ghost{background:#cbd5e1;color:#334155;}
.hint{font-size:.75rem;color:#475569;}

/* ── HOJA: carta apaisada, 2 órdenes ── */
.sheet{width:275mm;max-width:100%;margin:0 auto;background:#fff;display:flex;gap:0;box-shadow:0 8px 40px rgba(0,0,0,.25);}
.cut{width:0;border-left:1px dashed #999;position:relative;}
.orden{flex:1;width:135mm;padding:6mm;color:#000;font-size:7.5pt;line-height:1.2;}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid var(--ink);padding-bottom:2mm;gap:3mm;}
.hdr .brand h1{font-size:11pt;font-weight:900;color:var(--mg);}
.hdr .brand .sub{font-size:6pt;color:var(--soft);}
.hdr .center{text-align:center;}
.hdr .center .t{font-size:8pt;font-weight:900;letter-spacing:.5px;}
.hdr .center .n{font-size:10pt;font-weight:900;color:var(--mg);border:1.2px solid var(--mg);border-radius:1.5mm;padding:.5mm 2mm;display:inline-block;margin-top:.5mm;}
.hdr .qr{width:19mm;height:19mm;border:1px solid #ccc;flex-shrink:0;}
.hdr .qr img{width:100%;height:100%;display:block;}
.row{display:flex;border-bottom:1px solid #ccc;}
.fld{flex:1;padding:1mm 1.5mm;border-right:1px solid #e5e5e5;min-width:0;}
.fld:last-child{border-right:none;}
.fld .k{font-size:5.5pt;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.3px;}
.fld .v{font-size:8.5pt;font-weight:700;min-height:3.5mm;}
.sec{background:#111;color:#fff;font-size:6pt;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:1mm 1.5mm;margin-top:1.5mm;}
.odo{display:flex;justify-content:center;padding:1.5mm 0;border-bottom:1px solid #ccc;}
.teeth{display:flex;gap:.6mm;font-size:6.5pt;font-weight:700;}
.teeth span{width:5mm;text-align:center;border-bottom:1px solid #999;}
.teeth .sep{width:1px;background:#333;border:none;}
.checks{display:flex;flex-wrap:wrap;gap:1mm 3mm;padding:1.5mm;border-bottom:1px solid #ccc;}
.chk{display:flex;align-items:center;gap:1mm;font-size:6.5pt;}
.chk .b{width:2.6mm;height:2.6mm;border:1px solid #333;border-radius:.4mm;}
.tiempos{width:100%;border-collapse:collapse;font-size:6pt;}
.tiempos th,.tiempos td{border:1px solid #bbb;padding:.6mm 1mm;text-align:left;}
.tiempos th{background:#f1f1f1;font-size:5pt;text-transform:uppercase;color:#444;}
.tiempos td{height:4.6mm;}
.tiempos td:first-child{font-weight:700;background:#fafafa;}
.obs2{display:flex;border-bottom:1px solid #ccc;}
.obs2 .col{flex:1;padding:1.2mm;border-right:1px solid #e5e5e5;}
.obs2 .col:last-child{border-right:none;}
.obs2 .k{font-size:5.5pt;font-weight:800;color:var(--soft);text-transform:uppercase;}
.obs2 .ln{margin-top:.5mm;background:repeating-linear-gradient(transparent,transparent 4mm,#ddd 4mm,#ddd 4.4mm);min-height:12mm;font-size:7pt;}
.qrnote{background:#f8f4ec;border:1px solid #e6d9b8;border-radius:1mm;padding:1.2mm;margin-top:1.5mm;font-size:5.6pt;line-height:1.3;color:#5a4a1a;}
.firmas{display:flex;gap:3mm;padding-top:5mm;}
.firmas .f{flex:1;text-align:center;}
.firmas .f .l{border-top:1px solid #333;padding-top:.6mm;font-size:5.5pt;color:var(--soft);}
.foot{margin-top:2mm;font-size:5pt;color:#999;text-align:center;border-top:1px solid #eee;padding-top:1mm;}
.blankmark{text-align:center;font-size:7pt;color:#aaa;padding:2mm;}
@media print{
  @page{ size:letter landscape; margin:6mm; }
  body{background:#fff;padding:0;visibility:visible!important;}
  .bar{display:none;}
  .sheet{box-shadow:none;width:100%;}
}
</style>
</head>
<body>
<div class="bar">
  <button class="print" onclick="window.print()"><i class="fas fa-print"></i> Imprimir</button>
  <a class="ghost" href="rastreo.html"><i class="fas fa-arrow-left"></i> Volver</a>
  <span class="hint" id="modo"></span>
</div>
<div class="sheet" id="sheet"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.2/dist/umd/supabase.min.js" integrity="sha384-sgcvElP/LlNRtORGYFLO/9K/bENcpJK19HgvqslWXog6d8f/Va4TpltGiBlGntCM" crossorigin="anonymous"></script>
<script src="../js/auth-guard.js?v=20260717"></script>
<script>ProdigyAuth.require(['admin','operator','encargado_inventario','calidad','diseno','taller','fresado','impresion','secretaria']);</script>
<script>
const escH = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtD = d => d ? new Date(d).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'2-digit'}) : '';
const params = new URLSearchParams(location.search);
const C1 = (params.get('c')||'').trim().toUpperCase();
const C2 = (params.get('c2')||'').trim().toUpperCase();
const AREAS = ['Recepción','Yesos / modelos','Diseño CAD','Fresado','Impresión 3D','Sinterizado','Acabado','Control calidad','Empaque'];
const CHECKS = ['Impresión','Antagonista','Modelos','Articulador','Registro','Cubetas','Fotos/color','Llave implante','Tornillos','Mock-up'];
const SAMPLE = { codigo:'PRD-DIS-260922-A3F', dr_code:'DR-0007', nombre_paciente:'Valentina Gómez', tipo_trabajo:'Carillas cerámicas', material:'Zirconio Upcera HT', color_vita:'A2', cantidad:12, created_at:new Date().toISOString(), fecha_entrega:null, hash_seguridad:'', notas_cambios:'Cervicales delgados' };
let sb;

async function fetchCaso(codigo){
  if(!codigo) return null;
  const { data } = await sb.from('pedidos').select('codigo,nombre_paciente,tipo_trabajo,material,color_vita,cantidad,created_at,fecha_entrega,hash_seguridad,notas_cambios,user_id').eq('negocio','prodigy').eq('codigo',codigo).maybeSingle();
  if(!data) return null;
  data.dr_code = '—';
  if(data.user_id){
    try{ const { data: dp } = await sb.from('doctores_perfil').select('codigo_cliente').eq('id',data.user_id).maybeSingle(); if(dp&&dp.codigo_cliente) data.dr_code = dp.codigo_cliente; }catch(_){}
  }
  return data;
}

function renderOrden(c){
  if(!c){
    return `<div class="orden"><div class="hdr"><div class="brand"><h1>💎 PRODIGY</h1><div class="sub">Orden de producción — en blanco</div></div><div class="center"><div class="t">ORDEN DE PRODUCCIÓN</div><div class="n">Nº ______</div></div><div class="qr" style="display:flex;align-items:center;justify-content:center;font-size:5pt;color:#aaa;">sin QR</div></div>`
      + camposVacios() + `</div>`;
  }
  const qrUrl = 'https://prodigylabdental.com/app/caso-qr.html?c=' + encodeURIComponent(c.codigo||'') + (c.hash_seguridad?'&k='+encodeURIComponent(c.hash_seguridad):'');
  const qr = `<img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=0&data=${encodeURIComponent(qrUrl)}">`;
  return `<div class="orden">
    <div class="hdr">
      <div class="brand"><h1>💎 PRODIGY</h1><div class="sub">prodigylabdental.com · +57 321 281 6716</div></div>
      <div class="center"><div class="t">ORDEN DE PRODUCCIÓN</div><div class="n">Nº ${escH(c.codigo||'—')}</div></div>
      <div class="qr">${qr}</div>
    </div>
    <div class="row">
      <div class="fld"><div class="k">Doctor (código)</div><div class="v">${escH(c.dr_code||'—')}</div></div>
      <div class="fld"><div class="k">Paciente</div><div class="v">${escH(c.nombre_paciente||'')}</div></div>
      <div class="fld"><div class="k">Recibido</div><div class="v">${escH(fmtD(c.created_at))}</div></div>
      <div class="fld"><div class="k">Entrega</div><div class="v">${escH(fmtD(c.fecha_entrega))}</div></div>
    </div>
    <div class="row">
      <div class="fld"><div class="k">Trabajo</div><div class="v">${escH(c.tipo_trabajo||'')}</div></div>
      <div class="fld"><div class="k">Material</div><div class="v">${escH(c.material||'')}</div></div>
      <div class="fld"><div class="k">Color/VITA</div><div class="v">${escH(c.color_vita||'')}</div></div>
      <div class="fld"><div class="k">Cantidad</div><div class="v">${escH(c.cantidad||'')}</div></div>
    </div>
    ${cuerpo(c)}
  </div>`;
}

function odontograma(){
  const arr = n => n.map(x=>`<span>${x}</span>`).join('');
  return `<div class="sec">Odontograma (FDI)</div><div class="odo"><div>
    <div class="teeth">${arr([18,17,16,15,14,13,12,11])}<span class="sep"></span>${arr([21,22,23,24,25,26,27,28])}</div>
    <div class="teeth" style="margin-top:1.5mm;">${arr([48,47,46,45,44,43,42,41])}<span class="sep"></span>${arr([31,32,33,34,35,36,37,38])}</div>
  </div></div>`;
}
function checklist(){
  return `<div class="sec">Elementos recibidos</div><div class="checks">${CHECKS.map(x=>`<div class="chk"><span class="b"></span>${escH(x)}</div>`).join('')}<div class="chk"><span class="b"></span>Otro: ____</div></div>`;
}
function tiemposTabla(){
  return `<div class="sec">Control de tiempos y supervisión por área</div>
  <table class="tiempos"><tr><th>Área</th><th>Fecha</th><th>Entra</th><th>Sale</th><th>Técnico</th><th>V°B° Supervisor</th></tr>
  ${AREAS.map(a=>`<tr><td>${escH(a)}</td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}</table>`;
}
function obs(c){
  return `<div class="sec">Observaciones</div><div class="obs2">
    <div class="col"><div class="k">Indicaciones del odontólogo</div><div class="ln">${escH((c&&c.notas_cambios)||'')}</div></div>
    <div class="col"><div class="k">Notas internas / técnicas</div><div class="ln"></div></div>
  </div>`;
}
function firmas(){
  return `<div class="qrnote"><b>📱 CÓMO USAR EL QR (cada técnico, al RECIBIR y al TERMINAR):</b><br>1) Escanea el QR con la cámara. &nbsp; 2) Elige tu <b>área</b> y tu <b>nombre</b>. &nbsp; 3) Marca <b>qué recibiste</b> (llave, tornillos, modelo…) y el <b>estado</b> (completo / falta). &nbsp; 4) Toma <b>foto de esta orden</b>. &nbsp; 5) Guarda. &nbsp; Si se pierde el papel, la foto y el historial quedan en el sistema.</div>
  <div class="firmas"><div class="f"><div class="l">Recepción</div></div><div class="f"><div class="l">Control de calidad</div></div><div class="f"><div class="l">Supervisor (revisa cada proceso)</div></div></div>
  <div class="foot">Documento interno de trazabilidad · PRODIGY Digital Dentistry · Sin validez tributaria (la factura DIAN se emite aparte).</div>`;
}
function cuerpo(c){ return odontograma()+checklist()+tiemposTabla()+obs(c)+firmas(); }
function camposVacios(){
  return `<div class="row"><div class="fld"><div class="k">Doctor (código)</div><div class="v"></div></div><div class="fld"><div class="k">Paciente</div><div class="v"></div></div><div class="fld"><div class="k">Recibido</div><div class="v"></div></div><div class="fld"><div class="k">Entrega</div><div class="v"></div></div></div>
  <div class="row"><div class="fld"><div class="k">Trabajo</div><div class="v"></div></div><div class="fld"><div class="k">Material</div><div class="v"></div></div><div class="fld"><div class="k">Color/VITA</div><div class="v"></div></div><div class="fld"><div class="k">Cantidad</div><div class="v"></div></div></div>`
  + cuerpo(null);
}

async function init(){
  sb = (window.ProdigyAuth && window.ProdigyAuth.getSb) ? window.ProdigyAuth.getSb() : window.supabase.createClient(
    'https://zgihrwqfyvgyapbwzkvw.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnaWhyd3FmeXZneWFwYnd6a3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNzczNDksImV4cCI6MjA5MDg1MzM0OX0.9CzmFDQYeQKcbtAZoT1_n_OuJ1qPVJu3jImd938T634'
  );
  let d1 = await fetchCaso(C1);
  let d2 = await fetchCaso(C2);
  let ejemplo = false;
  if(!d1){ d1 = SAMPLE; ejemplo = true; }
  document.getElementById('modo').textContent = ejemplo ? 'Vista de EJEMPLO. Abre con ?c=CÓDIGO (y &c2=OTRO para 2 casos por hoja).' : (C2 ? '2 casos por hoja' : '1 caso (la mitad derecha queda en blanco para un caso a mano)');
  document.getElementById('sheet').innerHTML = renderOrden(d1) + '<div class="cut"></div>' + renderOrden(d2);
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
