<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>Carrusel abanico — preview | PRODIGY</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--mg:#D946A6;--gold:#D4AF37;--cyan:#00d2ff;--bg:#050505;--text:#f8fafc;--muted:#94a3b8}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 15%,rgba(217,70,166,.10),transparent 55%),radial-gradient(ellipse at 80% 85%,rgba(0,210,255,.08),transparent 55%);pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;text-align:center;padding:40px 16px 20px}
  h1{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;margin-bottom:6px}
  h1 em{font-style:normal;background:linear-gradient(90deg,var(--mg),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .lead{color:var(--muted);font-size:.9rem;max-width:560px;margin:0 auto 8px}

  /* ── Fan carousel ── */
  .fan-section{display:flex;flex-direction:column;align-items:center;width:100%;padding:16px 16px 32px;position:relative;z-index:2}
  .fan-layout{position:relative;display:flex;justify-content:center;align-items:center;width:100%;max-width:80rem;height:38rem}
  .fan-card{position:absolute;left:50%;top:50%;width:15rem;aspect-ratio:4/7;margin-left:-7.5rem;margin-top:-13.1rem;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);will-change:transform,opacity;cursor:pointer;background:#0d1525}
  .fan-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:10}
  .fan-card .cap{position:absolute;left:0;right:0;bottom:0;z-index:11;padding:14px 14px 12px;font-size:.8rem;font-weight:700;text-align:left;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);color:#fff}
  @media(max-width:1024px){.fan-layout{height:34rem}}
  @media(max-width:768px){.fan-layout{height:28rem}.fan-card{width:12rem;margin-left:-6rem;margin-top:-10.5rem}}
  @media(max-width:640px){.fan-layout{height:26rem}}
  @media(max-width:480px){.fan-layout{height:22rem}.fan-card{width:10rem;margin-left:-5rem;margin-top:-8.75rem}}

  .fan-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px;position:relative;z-index:3}
  .fan-arrow{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);backdrop-filter:blur(16px);color:rgba(255,255,255,.6);cursor:pointer;outline:none;transition:.25s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
  .fan-arrow:hover{border-color:rgba(255,255,255,.28);color:#fff}
  .fan-arrow:active{opacity:.7}
  .fan-dots{display:flex;align-items:center;gap:8px}
  .fan-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16);transition:.3s}
  .fan-dot.on{background:rgba(255,255,255,.85);transform:scale(1.35)}
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Galería <em>abanico</em> — preview</h1>
  <p class="lead">Efecto abanico portado a Vanilla JS + GSAP (tu stack). Pasa el mouse sobre las tarjetas y usa las flechas. Imágenes de ejemplo — en producción irían tus casos reales.</p>
</div>

<section class="fan-section">
  <div class="fan-layout" id="fan"></div>
  <div class="fan-nav" id="fanNav" style="display:none">
    <button class="fan-arrow" id="fanPrev" aria-label="Anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="fan-dots" id="fanDots"></div>
    <button class="fan-arrow" id="fanNext" aria-label="Siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  "use strict";
  var CARDS=[
    {img:"https://images.unsplash.com/photo-1606811841689-23dfddce3e95?w=400&h=700&fit=crop",cap:"Corona zirconia"},
    {img:"https://images.unsplash.com/photo-1629909613654-28e377c37b09?w=400&h=700&fit=crop",cap:"Diseño CAD"},
    {img:"https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=400&h=700&fit=crop",cap:"Carilla estética"},
    {img:"https://images.unsplash.com/photo-1609840114035-3c981b782dfe?w=400&h=700&fit=crop",cap:"Full-arch"},
    {img:"https://images.unsplash.com/photo-1584515933487-779824d29309?w=400&h=700&fit=crop",cap:"Guía quirúrgica"},
    {img:"https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=400&h=700&fit=crop",cap:"Fresado 5 ejes"},
    {img:"https://images.unsplash.com/photo-1581594693702-fbdc51b2763b?w=400&h=700&fit=crop",cap:"Escaneo intraoral"},
    {img:"https://images.unsplash.com/photo-1559757148-5c350d0d3c56?w=400&h=700&fit=crop",cap:"Provisional PMMA"},
    {img:"https://images.unsplash.com/photo-1598256989800-fe5f95da9787?w=400&h=700&fit=crop",cap:"Implantología"},
    {img:"https://images.unsplash.com/photo-1571772996211-2f02c9727629?w=400&h=700&fit=crop",cap:"Impresión 3D"}
  ];

  var MAX_VISIBLE=7, HALF=3;
  var FAN=[
    {rot:-21,scale:0.7756,x:-30,y:7.3,z:1},
    {rot:-14,scale:0.8498,x:-22,y:4.0,z:2},
    {rot:-7, scale:0.9346,x:-11,y:1.3,z:3},
    {rot:0,  scale:1.0,   x:0,  y:0.0,z:10},
    {rot:7,  scale:0.9346,x:11, y:1.3,z:3},
    {rot:14, scale:0.8498,x:22, y:4.0,z:2},
    {rot:21, scale:0.7756,x:30, y:7.3,z:1}
  ];
  function respMult(w){return w<480?0.28:w<640?0.38:w<768?0.5:w<1024?0.75:1.0;}
  function heightMult(w){var ideal=w<480?352:w<640?416:w<768?448:w<1024?544:608;var avail=window.innerHeight*0.7;return avail>=ideal?1:avail/ideal;}
  function slotConfig(total,slot){
    if(total>=MAX_VISIBLE)return FAN[slot];
    var center=total>>1;var d=total>1?(slot-center)/center:0;var ad=Math.abs(d);
    return {rot:d*21,scale:1.0-0.2244*ad*ad,x:d*30,y:ad*ad*7.3,z:10-Math.abs(slot-center)};
  }

  var layout=document.getElementById('fan');
  var total=CARDS.length;
  var needsPag=total>MAX_VISIBLE;
  var centerIndex=needsPag?HALF:total>>1;
  var isAnimating=false, hasEntered=false, direction=null, prevVisible=new Set(), cleanup=null;

  // build cards
  CARDS.forEach(function(c,i){
    var el=document.createElement('div');el.className='fan-card';
    el.innerHTML='<img src="'+c.img+'" loading="lazy" alt="'+(c.cap||('Caso '+i))+'"><div class="cap">'+(c.cap||'')+'</div>';
    layout.appendChild(el);
  });
  var cardEls=Array.prototype.slice.call(layout.querySelectorAll('.fan-card'));

  function visibleMap(center){
    var m=new Map();
    if(!needsPag){cardEls.forEach(function(_,i){m.set(i,i);});return m;}
    for(var slot=0;slot<MAX_VISIBLE;slot++){m.set(((center+slot-HALF)%total+total)%total,slot);}
    return m;
  }

  function render(){
    if(cleanup)cleanup();
    var vmap=visibleMap(centerIndex);
    var prev=prevVisible;
    var dir=direction;
    var first=!hasEntered;
    var mult=respMult(window.innerWidth);
    var hM=heightMult(window.innerWidth);
    var slotCount=needsPag?MAX_VISIBLE:total;
    var cfg=function(slot){return slotConfig(slotCount,slot);};
    if(first)isAnimating=true;
    var done=0,vcount=vmap.size;
    function onDone(){if(++done>=vcount){isAnimating=false;if(first)hasEntered=true;}}

    cardEls.forEach(function(card,ci){
      var slot=vmap.get(ci);var was=prev.has(ci);
      if(slot!==undefined){
        var p=cfg(slot);
        var target={x:(p.x*mult)+'rem',y:(p.y*hM)+'rem',rotation:p.rot,scale:p.scale,opacity:1,zIndex:p.z};
        if(first){
          gsap.set(card,{x:0,y:(12*hM)+'rem',rotation:0,scale:0.5,opacity:0});
          gsap.to(card,Object.assign({},target,{duration:1.2,ease:"elastic.out(1.05,.78)",delay:0.2+slot*0.06,onComplete:onDone}));
        }else if(!was){
          var ex=dir==='right'?40:-40;
          gsap.set(card,{x:ex+'rem',y:(p.y*hM)+'rem',rotation:dir==='right'?30:-30,scale:0.5,opacity:0});
          gsap.to(card,Object.assign({},target,{duration:0.6,ease:"power2.out",onComplete:onDone}));
        }else{
          gsap.to(card,Object.assign({},target,{duration:0.5,ease:"power2.out",onComplete:onDone}));
        }
      }else if(was){
        var exx=dir==='right'?-40:40;
        gsap.to(card,{x:exx+'rem',opacity:0,scale:0.5,rotation:dir==='right'?-30:30,duration:0.4,ease:"power2.in",zIndex:0});
      }else if(first){
        gsap.set(card,{opacity:0,scale:0.3,x:0,y:0,zIndex:0});
      }
    });
    prevVisible=new Set(vmap.keys());

    // hover
    var entries=[];cardEls.forEach(function(el,i){var s=vmap.get(i);if(s!==undefined)entries.push({el:el,slot:s});});
    entries.sort(function(a,b){return a.slot-b.slot;});
    var activeSlot=null,leaveTimer=null,centerSlot=entries.length>>1;
    function hoverLayout(hovered){
      var mm=respMult(window.innerWidth),hh=heightMult(window.innerWidth);
      entries.forEach(function(o){
        var base=cfg(o.slot);var tx=base.x*mm,ty=base.y*hh,tr=base.rot,ts=base.scale,delay=0;
        if(hovered!==null){
          var dist=Math.abs(o.slot-hovered);delay=dist*0.02;
          if(o.slot===hovered){ty-=2.5*hh;ts*=1.08;}
          else{
            var norm=centerSlot>0?(o.slot-centerSlot)/centerSlot:0;
            var push=8*(1-Math.abs(norm))*(1+0.2*Math.max(0,3-dist));
            if(o.slot<hovered){tx-=push*mm;tr-=3/(dist+1);}else{tx+=push*mm;tr+=3/(dist+1);}
            if(o.slot===entries.length-1&&hovered<centerSlot)ty-=1*hh;
            if(o.slot===0&&hovered>centerSlot)ty-=1*hh;
          }
        }else{delay=Math.abs(o.slot-centerSlot)*0.02;}
        gsap.to(o.el,{x:tx+'rem',y:ty+'rem',rotation:tr,scale:ts,duration:0.5,delay:delay,ease:"elastic.out(1,.75)",overwrite:"auto"});
        gsap.set(o.el,{zIndex:base.z});
      });
    }
    var enterH=entries.map(function(o){
      var h=function(){if(isAnimating)return;if(leaveTimer){clearTimeout(leaveTimer);leaveTimer=null;}if(activeSlot!==o.slot){activeSlot=o.slot;hoverLayout(o.slot);}};
      o.el.addEventListener('mouseenter',h);return {el:o.el,h:h};
    });
    function onLeave(){if(isAnimating)return;if(leaveTimer)clearTimeout(leaveTimer);leaveTimer=setTimeout(function(){activeSlot=null;hoverLayout(null);},50);}
    layout.addEventListener('mouseleave',onLeave);
    function onResize(){if(!isAnimating)hoverLayout(activeSlot);}
    window.addEventListener('resize',onResize);
    cleanup=function(){enterH.forEach(function(x){x.el.removeEventListener('mouseenter',x.h);});layout.removeEventListener('mouseleave',onLeave);window.removeEventListener('resize',onResize);if(leaveTimer)clearTimeout(leaveTimer);};
  }

  function cycle(dir){if(isAnimating||!needsPag)return;isAnimating=true;direction=dir;centerIndex=dir==='right'?(centerIndex+1)%total:(centerIndex-1+total)%total;render();updateDots();}

  // nav
  var dotsWrap=document.getElementById('fanDots');
  function updateDots(){Array.prototype.forEach.call(dotsWrap.children,function(d,i){d.classList.toggle('on',i===centerIndex);});}
  if(needsPag){
    document.getElementById('fanNav').style.display='flex';
    CARDS.forEach(function(_,i){var d=document.createElement('span');d.className='fan-dot'+(i===centerIndex?' on':'');dotsWrap.appendChild(d);});
    document.getElementById('fanPrev').addEventListener('click',function(){cycle('left');});
    document.getElementById('fanNext').addEventListener('click',function(){cycle('right');});
  }

  render();
})();
</script>
</body>
</html>
