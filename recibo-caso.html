<style>
/* ── SCREEN ── */
:root{--gold:#D4AF37;--mg:#D946A6;--cyan:#00d2ff;--green:#00FF41;--bg:#050505;--card:#0d1520;--text:#e2e8f0;--muted:#94a3b8;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:40px 24px;}
.no-print{display:block;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;gap:16px;flex-wrap:wrap;}
.topbar h1{font-size:1rem;font-weight:900;color:var(--gold);letter-spacing:2px;}
.btn-pdf{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:linear-gradient(135deg,var(--mg),#9333ea);color:#fff;border:none;border-radius:8px;font-weight:800;font-size:.88rem;cursor:pointer;}
.btn-pdf:hover{opacity:.88;}

.recibo{background:#fff;color:#1a1a2e;max-width:780px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5);}

/* HEADER */
.rec-header{background:linear-gradient(135deg,#0f0a00,#1a1200);color:#fff;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.rec-logo h2{font-size:1.2rem;font-weight:900;letter-spacing:2px;color:#D4AF37;margin-bottom:2px;}
.rec-logo p{font-size:.72rem;color:#94a3b8;}
.rec-meta{text-align:right;}
.rec-meta .rec-num{font-size:1.1rem;font-weight:900;color:#D4AF37;font-family:monospace;}
.rec-meta .rec-tipo{font-size:.62rem;font-weight:700;letter-spacing:2px;color:#94a3b8;text-transform:uppercase;margin-bottom:4px;}

/* SECCIONES */
.rec-body{padding:28px 32px;}
.rec-section{margin-bottom:24px;}
.rec-section-title{font-size:.62rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#0f0a00,#1a1200);padding:7px 14px;border-radius:6px;margin-bottom:12px;display:inline-block;}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;}
.rec-field{margin-bottom:4px;}
.rec-field .lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;margin-bottom:2px;}
.rec-field .val{font-size:.88rem;font-weight:600;color:#1a1a2e;}

/* TIMELINE */
.timeline{list-style:none;padding-left:0;}
.tl-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06);}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:10px;height:10px;border-radius:50%;background:#D4AF37;flex-shrink:0;margin-top:5px;}
.tl-dot.aprobado{background:#00c851;}
.tl-dot.entregado{background:#00c851;}
.tl-dot.pago{background:#00d2ff;}
.tl-fecha{font-size:.72rem;color:#94a3b8;min-width:140px;flex-shrink:0;}
.tl-desc{font-size:.82rem;color:#1a1a2e;font-weight:500;}

/* PAGO */
.pago-box{background:#f8fafb;border:2px solid #e2e8f0;border-radius:10px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.pago-total{font-size:1.6rem;font-weight:900;color:#1a1a2e;}
.pago-total span{font-size:.72rem;color:#94a3b8;display:block;font-weight:500;margin-bottom:2px;}
.pago-estado{padding:6px 16px;border-radius:20px;font-size:.75rem;font-weight:800;}
.pago-estado.confirmado{background:#e8fdf0;color:#00873d;border:1px solid #00c851;}
.pago-estado.pendiente{background:#fef9e7;color:#b7791f;border:1px solid #f6e05e;}
.pago-estado.subido{background:#e8f4ff;color:#1a7acc;border:1px solid #63b3ed;}

/* FOOTER */
.rec-footer{background:#f8fafb;border-top:2px solid #e2e8f0;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.rec-footer p{font-size:.72rem;color:#94a3b8;}
.rec-footer .legal{font-size:.65rem;color:#cbd5e1;max-width:400px;line-height:1.6;}

/* SPINNER / ERROR */
.loader{text-align:center;padding:60px;color:var(--muted);font-size:.9rem;}
.loader i{font-size:2rem;display:block;margin-bottom:12px;animation:spin .8s linear infinite;color:var(--gold);}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{text-align:center;padding:60px;color:#f87171;}
.error-box i{font-size:2.5rem;display:block;margin-bottom:12px;}

/* ── PRINT ── */
@media print{
  body{background:#fff;padding:0;}
  .no-print{display:none!important;}
  .recibo{box-shadow:none;border-radius:0;max-width:100%;}
  .rec-header{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .rec-section-title{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pago-estado{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  @page{margin:15mm;}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
</style>

<script>
const SUPA_URL  = 'https://zgihrwqfyvgyapbwzkvw.supabase.co';
const SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnaWhyd3FmeXZneWFwYnd6a3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNzczNDksImV4cCI6MjA5MDg1MzM0OX0.9CzmFDQYeQKcbtAZoT1_n_OuJ1qPVJu3jImd938T634';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

function escH(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtFecha(ts,opts){if(!ts)return'—';return new Date(ts).toLocaleDateString('es',opts||{day:'2-digit',month:'short',year:'numeric'});}
function fmtFechaHora(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}

function pagoEstadoBadge(estado){
  const _escR=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const map={pago_confirmado:'confirmado',Pagado:'confirmado',pendiente:'pendiente',pago_subido:'subido'};
  const lbl={pago_confirmado:'✅ Pagado',Pagado:'✅ Pagado',pendiente:'⏳ Pendiente',pago_subido:'⏳ En revisión'};
  const cls=map[estado]||'pendiente';
  return`<span class="pago-estado ${cls}">${lbl[estado]||_escR(estado)}</span>`;
}

function fmtCOP(n){if(!n&&n!==0)return'—';return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);}
function fmtUSD(n){if(!n&&n!==0)return'—';return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(n);}
const TRM = 4200; // COP por USD — ajustar según TRM
function copToUsd(cop){return cop ? Math.round((cop/TRM)*100)/100 : 0;}
let _isIntl = false; // se activa si pais !== 'CO'

function buildTimeline(pedido, revisiones){
  const items=[];
  if(pedido.created_at) items.push({ts:pedido.created_at,desc:'Caso recibido',cls:''});
  const pagado=pedido.estado==='Pagado'||pedido.pago_estado==='pago_confirmado'||pedido.pago_estado==='Pagado';
  if(pagado&&pedido.updated_at) items.push({ts:pedido.updated_at,desc:'Pago confirmado',cls:'pago'});
  (revisiones||[]).forEach(r=>{
    if(r.creado_en) items.push({ts:r.creado_en,desc:`Diseño enviado (Rev ${escH(String(r.revision_num??''))})`,cls:''});
    if(r.notas_cliente) items.push({ts:r.creado_en,desc:`Cambios solicitados: "${escH(r.notas_cliente)}"`,cls:''});
  });
  if(pedido.diseno_aprobado&&pedido.updated_at) items.push({ts:pedido.updated_at,desc:'Diseño APROBADO',cls:'aprobado'});
  const entregado=(pedido.estado||'').toLowerCase().includes('entregado')||(pedido.estado||'').toLowerCase().includes('despachado');
  if(entregado&&pedido.updated_at) items.push({ts:pedido.updated_at,desc:'Caso entregado',cls:'entregado'});
  items.sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  if(!items.length) return '<p style="color:#94a3b8;font-size:.82rem;">Sin eventos registrados.</p>';
  return`<ul class="timeline">${items.map(i=>`<li class="tl-item"><div class="tl-dot ${escH(i.cls)}"></div><span class="tl-fecha">${fmtFechaHora(i.ts)}</span><span class="tl-desc">${i.desc}</span></li>`).join('')}</ul>`;
}

function render(pedido, revisiones){
  const rev=revisiones||[];
  const codigo=pedido.codigo||pedido.id?.slice(0,8)||'—';
  const docGen=fmtFecha(new Date().toISOString());
  const aprobFecha=pedido.diseno_aprobado?fmtFechaHora(pedido.updated_at):'—';
  const total=pedido.total_cop||pedido.total||pedido.precio_total;

  // Modo internacional: pais != CO o ?lang=en en URL
  _isIntl = (pedido.pais && pedido.pais !== 'CO') || new URLSearchParams(location.search).get('lang') === 'en';
  const L = _isIntl ? {
    title:'PRODIGY Digital Dentistry — Technical Invoice',
    tipo:'Technical Invoice',
    sCaso:'Case Data',
    sServicio:'Service Performed',
    sTimeline:'Case Timeline',
    sPago:'Payment',
    lCodigo:'Case #',lFecha:'Received',lCliente:'Client / Doctor',lClinica:'Clinic',
    lServicio:'Service Type',lMaterial:'Material',lPiezas:'Units',lRevs:'Revisions',lEstado:'Status',lAprobFecha:'Approval Date',
    lTotal:'Total',lMetodo:'Method: Wire transfer / PayPal / Wise / Stripe',
    lAbono:'Deposit (50%)',lAbonoPaid:'Paid at start',
    lSaldo:'Balance (50%)',lSaldoPaid:'✅ Paid',lSaldoPend:'⏳ Due on delivery',
    lComprobantes:'Payment records:',lAbonoCmp:'Deposit receipt',lSaldoCmp:'Balance receipt',
    lDoc:'Document generated',lLegal:`© ${new Date().getFullYear()} PRODIGY Digital Dentistry · WhatsApp +57 321 281 6716 · Medellín, Colombia · Technical service document.`,
    estadoMap:{pago_confirmado:'✅ Paid',pendiente:'⏳ Pending',pago_subido:'⏳ Under review'},
    estadoCls:{pago_confirmado:'confirmado',pendiente:'pendiente',pago_subido:'subido'},
  } : {
    title:'PRODIGY Digital Dentistry — Recibo Técnico',
    tipo:'Recibo Técnico',
    sCaso:'Datos del Caso',
    sServicio:'Servicio Realizado',
    sTimeline:'Timeline del Caso',
    sPago:'Pago',
    lCodigo:'Código',lFecha:'Fecha recepción',lCliente:'Cliente / Doctor',lClinica:'Clínica',
    lServicio:'Tipo de servicio',lMaterial:'Material',lPiezas:'Piezas',lRevs:'Revisiones usadas',lEstado:'Estado',lAprobFecha:'Fecha aprobación',
    lTotal:'Total',lMetodo:'Método: Nequi / Bancolombia / Daviplata',
    lAbono:'Abono (50%)',lAbonoPaid:'Pagado al inicio',
    lSaldo:'Saldo (50%)',lSaldoPaid:'✅ Pagado',lSaldoPend:'⏳ Contra entrega',
    lComprobantes:'Comprobantes registrados:',lAbonoCmp:'Abono',lSaldoCmp:'Saldo',
    lDoc:'Documento generado',lLegal:`© ${new Date().getFullYear()} PRODIGY Digital Dentistry · WhatsApp +57 321 281 6716 · Medellín, Colombia · Documento de trazabilidad técnica y contable.`,
    estadoMap:{pago_confirmado:'✅ Pagado',pendiente:'⏳ Pendiente',pago_subido:'⏳ En revisión'},
    estadoCls:{pago_confirmado:'confirmado',pendiente:'pendiente',pago_subido:'subido'},
  };

  // Precio: USD para internacionales, COP para locales
  const totalUsd = pedido.total_usd || (total ? copToUsd(total) : null);
  const fmtTotal = _isIntl
    ? (totalUsd ? fmtUSD(totalUsd) : (total ? fmtCOP(total)+' COP' : '—'))
    : (total ? fmtCOP(total) : '—');
  const fmtAbono = _isIntl
    ? (totalUsd ? fmtUSD(Math.round(totalUsd/2*100)/100) : fmtCOP(Math.round((total||0)/2)))
    : fmtCOP(Math.round((total||0)/2));
  const saldoMonto = pedido.saldo_pendiente_monto ?? Math.round((total||0)/2);
  const fmtSaldo = _isIntl
    ? (totalUsd ? fmtUSD(Math.round(totalUsd/2*100)/100) : fmtCOP(saldoMonto))
    : fmtCOP(saldoMonto);

  const pagado=(pedido.pago_estado==='pago_confirmado'||pedido.pago_estado==='Pagado');
  const estadoCls=L.estadoCls[pedido.pago_estado||'pendiente']||'pendiente';
  const estadoLbl=L.estadoMap[pedido.pago_estado||'pendiente']||pedido.pago_estado||'—';

  document.title = L.title;
  document.querySelector('.topbar h1').textContent = '💎 ' + L.title;

  document.getElementById('recibo-wrap').innerHTML=`
  <div class="recibo">
    <div class="rec-header">
      <div class="rec-logo">
        <h2>💎 PRODIGY Digital Dentistry</h2>
        <p>prodigylabdental.com · +57 321 281 6716 · Medellín, Colombia</p>
      </div>
      <div class="rec-meta">
        <div class="rec-tipo">${escH(L.tipo)}</div>
        <div class="rec-num">#${escH(codigo)}</div>
        ${_isIntl ? `<div style="font-size:.58rem;color:#94a3b8;margin-top:3px;letter-spacing:1px;">NIT 900.XXX.XXX-X</div>` : ''}
      </div>
    </div>

    <div class="rec-body">

      <div class="rec-section">
        <div class="rec-section-title"><i class="fas fa-folder-open" style="margin-right:6px"></i>${escH(L.sCaso)}</div>
        <div class="rec-grid">
          <div class="rec-field"><div class="lbl">${escH(L.lCodigo)}</div><div class="val" style="font-family:monospace">${escH(codigo)}</div></div>
          <div class="rec-field"><div class="lbl">${escH(L.lFecha)}</div><div class="val">${fmtFecha(pedido.created_at)}</div></div>
          <div class="rec-field"><div class="lbl">${escH(L.lCliente)}</div><div class="val">${escH(pedido.doctor||pedido.nombre||pedido.nombre_doctor||'—')}</div></div>
          <div class="rec-field"><div class="lbl">${escH(L.lClinica)}</div><div class="val">${escH(pedido.clinica||'—')}</div></div>
        </div>
      </div>

      <div class="rec-section">
        <div class="rec-section-title"><i class="fas fa-drafting-compass" style="margin-right:6px"></i>${escH(L.sServicio)}</div>
        <div class="rec-grid">
          <div class="rec-field"><div class="lbl">${escH(L.lServicio)}</div><div class="val">${escH(pedido.servicio||pedido.categoria||pedido.tipo_trabajo||'—')}</div></div>
          <div class="rec-field"><div class="lbl">${escH(L.lMaterial)}</div><div class="val">${escH(pedido.material||'—')}</div></div>
          ${pedido.piezas?`<div class="rec-field"><div class="lbl">${escH(L.lPiezas)}</div><div class="val">${escH(String(pedido.piezas))}</div></div>`:''}
          ${pedido.revisiones_usadas!=null?`<div class="rec-field"><div class="lbl">${escH(L.lRevs)}</div><div class="val">${escH(String(pedido.revisiones_usadas))} / 2</div></div>`:''}
          <div class="rec-field"><div class="lbl">${escH(L.lEstado)}</div><div class="val">${escH(pedido.estado||pedido.estado_operativo||'—')}</div></div>
          ${aprobFecha!=='—'?`<div class="rec-field"><div class="lbl">${escH(L.lAprobFecha)}</div><div class="val">${escH(aprobFecha)}</div></div>`:''}
        </div>
      </div>

      <div class="rec-section">
        <div class="rec-section-title"><i class="fas fa-timeline" style="margin-right:6px"></i>${escH(L.sTimeline)}</div>
        ${buildTimeline(pedido,rev)}
      </div>

      <div class="rec-section">
        <div class="rec-section-title"><i class="fas fa-credit-card" style="margin-right:6px"></i>${escH(L.sPago)}</div>
        <div class="pago-box">
          <div class="pago-total">
            <span>${escH(L.lTotal)}</span>
            ${fmtTotal}
            ${_isIntl && total ? `<span style="font-size:.62rem;color:#94a3b8;font-weight:400;">(≈ ${fmtCOP(total)} COP ref.)</span>` : ''}
          </div>
          <div>
            <div style="font-size:.72rem;color:#94a3b8;margin-bottom:4px;">${escH(L.lMetodo)}</div>
            <span class="pago-estado ${estadoCls}">${estadoLbl}</span>
          </div>
        </div>
        ${total ? `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
          <div style="background:#f1f5f9;border-radius:8px;padding:10px 14px;">
            <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin-bottom:3px;">${escH(L.lAbono)}</div>
            <div style="font-size:.92rem;font-weight:700;color:#1a1a2e;">${fmtAbono}</div>
            <div style="font-size:.65rem;color:#64748b;margin-top:2px;">${escH(L.lAbonoPaid)}</div>
          </div>
          <div style="background:${pagado?'#e8fdf0':'#fef9e7'};border-radius:8px;padding:10px 14px;">
            <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin-bottom:3px;">${escH(L.lSaldo)}</div>
            <div style="font-size:.92rem;font-weight:700;color:#1a1a2e;">${fmtSaldo}</div>
            <div style="font-size:.65rem;color:${pagado?'#00873d':'#b7791f'};margin-top:2px;font-weight:700;">
              ${pagado ? escH(L.lSaldoPaid) : escH(L.lSaldoPend)}
            </div>
          </div>
        </div>
        ${pedido.comprobante_abono_url||pedido.comprobante_saldo_url ? `
        <div style="margin-top:10px;font-size:.72rem;color:#64748b;">
          ${escH(L.lComprobantes)}
          ${pedido.comprobante_abono_url?`<a href="${escH(pedido.comprobante_abono_url)}" target="_blank" rel="noopener noreferrer" style="color:#1a7acc;margin-left:8px;">📎 ${escH(L.lAbonoCmp)}</a>`:''}
          ${pedido.comprobante_saldo_url?`<a href="${escH(pedido.comprobante_saldo_url)}" target="_blank" rel="noopener noreferrer" style="color:#1a7acc;margin-left:8px;">📎 ${escH(L.lSaldoCmp)}</a>`:''}
        </div>` : ''}
        ` : ''}
      </div>

      ${pedido.factura_pdf_url || pedido.factura_numero ? `
      <div class="rec-section">
        <div class="rec-section-title" style="background:linear-gradient(135deg,#0a3d0a,#0d5c0d);">
          <i class="fas fa-file-certificate" style="margin-right:6px"></i>
          ${_isIntl ? 'Official DIAN Electronic Invoice' : 'Factura Electrónica DIAN'}
        </div>
        <div style="background:#f0fdf4;border:2px solid #86efac;border-radius:10px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <div>
            ${pedido.factura_numero ? `<div style="font-size:.72rem;font-weight:700;color:#15803d;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">${_isIntl?'Invoice #':'Factura #'}${escH(pedido.factura_numero)}</div>` : ''}
            ${pedido.factura_cufe  ? `<div style="font-size:.62rem;color:#64748b;word-break:break-all;max-width:380px;"><strong>CUFE:</strong> ${escH(pedido.factura_cufe)}</div>` : ''}
            <div style="font-size:.65rem;color:#64748b;margin-top:4px;">
              ${_isIntl
                ? 'Electronically issued and validated by DIAN (Colombian Tax Authority).'
                : 'Emitida y validada electrónicamente ante la DIAN — Resolución de numeración activa.'}
            </div>
          </div>
          ${pedido.factura_pdf_url ? `
          <a href="${escH(pedido.factura_pdf_url)}" target="_blank" rel="noopener noreferrer"
             style="display:inline-flex;align-items:center;gap:8px;padding:9px 18px;background:#16a34a;color:#fff;border-radius:8px;font-weight:700;font-size:.8rem;text-decoration:none;white-space:nowrap;">
            <i class="fas fa-file-pdf"></i> ${_isIntl ? 'Download Invoice PDF' : 'Descargar Factura PDF'}
          </a>` : '<span style="font-size:.72rem;color:#94a3b8;">PDF en proceso…</span>'}
        </div>
      </div>` : (pedido.requiere_factura ? `
      <div class="rec-section">
        <div style="background:#fefce8;border:1.5px solid #fde047;border-radius:10px;padding:14px 18px;">
          <div style="font-size:.72rem;font-weight:700;color:#a16207;margin-bottom:3px;">
            ⏳ ${_isIntl ? 'Invoice pending' : 'Factura electrónica pendiente'}
          </div>
          <div style="font-size:.68rem;color:#64748b;">
            ${_isIntl
              ? 'Your electronic invoice is being processed. It will be available here once issued (max. 24 business hours).'
              : 'Tu factura electrónica está siendo procesada. Estará disponible aquí una vez emitida (máx. 24h hábiles).'}
          </div>
        </div>
      </div>` : '')}

    </div>

    <!-- QR de seguimiento -->
    <div style="display:flex;align-items:center;gap:20px;background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:20px;">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent('https://prodigylabdental.com/seguimiento-caso?id='+escH(codigo))}&bgcolor=050505&color=D4AF37&format=png" alt="QR seguimiento caso ${escH(codigo)}" width="90" height="90" style="border-radius:6px;flex-shrink:0;" loading="lazy">
      <div>
        <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#D4AF37;margin-bottom:4px;">Seguimiento en tiempo real</div>
        <div style="font-size:.78rem;color:#94a3b8;line-height:1.5;">Escanea el QR o visita<br><strong style="color:#fff;">prodigylabdental.com/seguimiento-caso?id=${escH(codigo)}</strong></div>
      </div>
    </div>

    <div class="rec-footer">
      <p>${escH(L.lDoc)}: ${escH(docGen)}</p>
      <div>
        <p class="legal">${escH(L.lLegal)}</p>
        ${!_isIntl ? `<p class="legal" style="margin-top:4px;color:#94a3b8;">
          ⚠ Este documento es un comprobante de trazabilidad interna. El documento con validez tributaria ante la DIAN es la factura electrónica con CUFE, emitida por PRODIGY Lab Dental cuando es solicitada por el cliente.
        </p>` : `<p class="legal" style="margin-top:4px;color:#94a3b8;">
          ⚠ This document is an internal tracking receipt. The legally valid tax document is the DIAN-certified electronic invoice (with CUFE), issued upon client request.
        </p>`}
      </div>
    </div>
  </div>`;
}

(async function init(){
  const session = await ProdigyAuth.require(['client','admin','operator'],'/app/login');
  if(!session) return;

  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  if(!id){
    document.getElementById('recibo-wrap').innerHTML=`<div class="error-box"><i class="fas fa-exclamation-triangle"></i>No se especificó un ID de caso. Usa ?id=CODIGO en la URL.</div>`;
    return;
  }

  try{
    const _id=encodeURIComponent(id);
    let{data,error}=await sb.from('pedidos').select('*,factura_pdf_url,factura_numero,factura_cufe,requiere_factura,factura_estado,pais,total_usd,precio_total').or(`id.eq.${_id},codigo.eq.${_id}`).maybeSingle();
    if(!data){
      const r2=await sb.from('pedidos').select('*').eq('codigo',id).maybeSingle();
      if(!r2.data){
        document.getElementById('recibo-wrap').innerHTML=`<div class="error-box"><i class="fas fa-exclamation-triangle"></i>Caso no encontrado: ${escH(id)}</div>`;
        return;
      }
      data=r2.data;
    }

    let revisiones=[];
    try{
      const{data:revs}=await sb.from('diseno_revisiones').select('*').eq('pedido_id',data.id).order('revision_num',{ascending:true});
      revisiones=revs||[];
    }catch(e){}

    render(data,revisiones);
    // Mostrar bloque de referidos al recibir caso exitoso
    if (data.estado && ['QA_APROBADO','LISTO_DESPACHAR','EN_REPARTO','ENTREGADO'].includes(data.estado_operativo||'')) {
      try {
        const userEmail = session.user?.email;
        if (userEmail) {
          const { data: refCodigo } = await sb.rpc('obtener_mi_codigo_referido', {
            p_email: userEmail,
            p_nombre: data.doctor || data.nombre_doctor || ''
          });
          if (refCodigo) {
            const refBlock = document.createElement('div');
            refBlock.style.cssText = 'background:rgba(0,255,65,.07);border:1px solid rgba(0,255,65,.25);border-radius:14px;padding:20px 24px;margin-top:24px;';
            refBlock.innerHTML = `
              <div style="font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:#00FF41;margin-bottom:8px;">🎁 Comparte y gana</div>
              <p style="font-size:.84rem;color:#94a3b8;margin-bottom:12px;">¡Gracias por confiar en PRODIGY! Refiere un colega y él obtiene <strong style="color:#00FF41;">5% de descuento</strong> en su primer caso.</p>
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <div style="background:rgba(0,0,0,.4);border:1px solid rgba(0,255,65,.3);border-radius:8px;padding:8px 16px;font-size:1.1rem;font-weight:900;color:#fff;letter-spacing:3px;">${escH(refCodigo)}</div>
                <button type="button" onclick="navigator.clipboard?.writeText('Hola! Te recomiendo PRODIGY Lab Dental para tus casos CAD/CAM. Usa mi código ${escH(refCodigo)} y obtén 5% de descuento en tu primer caso: https://prodigylabdental.com').then(()=>this.textContent='✓ Copiado').catch(()=>{})" style="background:rgba(0,255,65,.15);border:1px solid rgba(0,255,65,.3);color:#00FF41;border-radius:8px;padding:8px 16px;font-size:.78rem;font-weight:700;cursor:pointer;">Copiar mensaje</button>
                <a href="https://wa.me/?text=${encodeURIComponent('Hola! Te recomiendo PRODIGY Lab Dental. Usa mi código ' + refCodigo + ' y obtén 5% de descuento: https://prodigylabdental.com')}" target="_blank" rel="noopener noreferrer" style="background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);color:#25D366;border-radius:8px;padding:8px 16px;font-size:.78rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;"><i class="fab fa-whatsapp"></i> Compartir WA</a>
              </div>`;
            document.getElementById('recibo-wrap')?.appendChild(refBlock);
          }
        }
      } catch(_) {}
    }
  }catch(e){
    document.getElementById('recibo-wrap').innerHTML=`<div class="error-box"><i class="fas fa-exclamation-triangle"></i>Error: ${escH(String(e.message||e))}</div>`;
  }
})();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
</body>
