/* Lista de precios privada (oct-2026): se abre solo con el enlace personal del doctor (sql/enlaces-cliente-2026.sql).

:root{--mg:#D946A6;--gold:#D4AF37;--cyan:#00d2ff;--neon:#00FF41;--bg:#050505;--card:#0d1520;--card2:#131d2b;--text:#e2e8f0;--muted:#94a3b8;--line:rgba(255,255,255,.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;line-height:1.55;padding:0 16px 48px}
.doc{max-width:860px;margin:0 auto}
.cab{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.marca b{font-size:1.15rem;font-weight:900;letter-spacing:.18em;color:var(--gold)}
.marca span{display:block;font-size:.62rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font:inherit;font-size:.84rem;font-weight:800;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);border:0;color:#fff}
.btn-mg{background:linear-gradient(135deg,var(--mg),#b0267f);border:0;color:#fff}
.hola{padding:26px 0 8px}
.hola .ceja{font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.hola h1{font-size:clamp(1.5rem,3.6vw,2.2rem);font-weight:900;line-height:1.15;margin:6px 0 8px;text-wrap:balance}
.hola p{color:var(--muted);max-width:62ch}
.reglas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 8px}
.reglas div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.84rem}
.reglas i{color:var(--gold);margin-right:6px}
.grupo{margin-top:28px}
.grupo h2{font-size:1.05rem;font-weight:900;letter-spacing:.04em;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.grupo h2 i{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.cat h3{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--line)}
.it{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.it:last-child{border-bottom:0}
.it .nom{font-size:.9rem}
.it .nom small{display:block;color:var(--muted);font-size:.76rem}
.it .pre{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
.it .pre s{color:var(--muted);font-weight:500;margin-right:6px}
.it .pre em{font-style:normal;color:var(--neon)}
.rapido{display:inline-block;margin-left:6px;font-size:.62rem;font-weight:800;letter-spacing:.08em;color:#04121a;background:var(--cyan);border-radius:4px;padding:1px 5px;vertical-align:middle}
.pie{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.aviso{max-width:520px;margin:12vh auto 0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
.aviso i{font-size:2rem;color:var(--gold);margin-bottom:10px}
.aviso h1{font-size:1.2rem;margin-bottom:8px}
.aviso p{color:var(--muted);margin-bottom:16px}
.cargando{text-align:center;color:var(--muted);padding:18vh 0}
@media(max-width:640px){.reglas{grid-template-columns:1fr}.it{flex-direction:column;gap:2px}}
@media print{
  body{background:#fff;color:#111;padding:0}
  .no-print{display:none!important}
  .cat,.reglas div{background:#fff;border-color:#ccc}
  .cat h3{background:#f3f3f3;color:#333}
  .it .pre,.it .nom{color:#111}.hola p,.pie,.it .nom small{color:#444}
  .marca b{color:#8a6d00}.hola .ceja{color:#006a80}
  .grupo{break-inside:avoid-page}.cat{break-inside:avoid}
}
</style>
</head>

<script>
(function () {

  var SB = 'https://zgihrwqfyvgyapbwzkvw.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnaWhyd3FmeXZneWFwYnd6a3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNzczNDksImV4cCI6MjA5MDg1MzM0OX0.9CzmFDQYeQKcbtAZoT1_n_OuJ1qPVJu3jImd938T634';
  var H = { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' };
  var WA = '573212816716';
  var doc = document.getElementById('doc');
  function escH(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function cop(n) { return '$' + Math.round(Number(n) || 0).toLocaleString('es-CO'); }
  var FLUJOS = {
    diseno:    { t: 'Diseño CAD', i: 'fa-pen-ruler', c: 'var(--mg)', bg: 'rgba(217,70,166,.14)' },
    fresado:   { t: 'Fresado CAM', i: 'fa-gear', c: 'var(--gold)', bg: 'rgba(212,175,55,.14)' },
    impresion: { t: 'Impresión 3D', i: 'fa-cube', c: 'var(--cyan)', bg: 'rgba(0,210,255,.12)' }

  var CATS = { cad_fija: 'Prótesis fija', cad_implantes: 'Sobre implantes', cad_quirurgica: 'Cirugía guiada', cad_removible: 'Removibles',
    zirc: 'Zirconio', disi: 'Disilicato (e.max)', pmma: 'PMMA', metal: 'Metal y titanio', cera: 'Cera',

      '<a class="btn btn-wa" href="https://wa.me/' + WA + '?text=' + encodeURIComponent('Hola PRODIGY, necesito mi lista de precios actualizada.') + '" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Pedir un enlace nuevo</a></div>';
  }

  var token = (location.hash.match(/(?:^#|&)e=([0-9a-f]{40})/) || [])[1] || (location.search.match(/[?&]e=([0-9a-f]{40})/) || [])[1];
  if (!token) { aviso('Esta lista de precios es privada', 'Se abre solo con el enlace personal que te envía PRODIGY por WhatsApp.'); return; }

  fetch(SB + '/rest/v1/rpc/abrir_enlace_cliente', { method: 'POST', headers: H, body: JSON.stringify({ p_token: token }) })

        .then(function (items) { pintar(e, Array.isArray(items) ? items : []); });
    })
    .catch(function () { aviso('No pudimos abrir tu lista', 'Revisa tu conexión e inténtalo de nuevo, o escríbenos por WhatsApp.'); });

  function pintar(e, items) {
    var d = e.doctor || {}, hoy = new Date(), hoyTxt = hoy.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
    var vence = new Date(e.expira_at).toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
    var nombre = String(d.nombre || '').trim(), sal = nombre ? (/^dr/i.test(nombre) ? nombre : 'Dr(a). ' + nombre) : 'Doctor(a)';
    var grupos = {};
    items.forEach(function (x) { var f = FLUJOS[x.flujo] ? x.flujo : 'otros'; (grupos[f] = grupos[f] || {}); (grupos[f][x.categoria || 'otros'] = grupos[f][x.categoria || 'otros'] || []).push(x); });
    var html = '<header class="cab"><a class="marca" href="/" aria-label="PRODIGY Lab Dental"><span style="font-size:1.6rem">💎</span><div><b>PRODIGY</b><span>Digital Dentistry</span></div></a>' +
      '<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" onclick="window.print()"><i class="fas fa-file-pdf"></i> Guardar PDF</button></div></header>' +
      '<section class="hola"><div class="ceja">Lista de precios personal · ' + escH(hoyTxt) + '</div>' +
      '<h1>Hola, ' + escH(sal) + (d.clinica ? ' <span style="color:var(--muted);font-weight:700">· ' + escH(d.clinica) + '</span>' : '') + '</h1>' +
      '<p>Estos son los precios vigentes de PRODIGY Lab Dental en pesos colombianos (COP)' + (d.codigo ? ', para tu código de cliente <b style="color:var(--gold)">' + escH(d.codigo) + '</b>' : '') + '. El enlace es personal y vence el ' + escH(vence) + '.</p>' +

    ['diseno', 'fresado', 'impresion', 'otros'].forEach(function (f) {
      if (!grupos[f]) return;
      var F = FLUJOS[f] || { t: 'Otros servicios', i: 'fa-tooth', c: 'var(--text)', bg: 'rgba(255,255,255,.06)' };
      html += '<section class="grupo"><h2><i class="fas ' + F.i + '" style="color:' + F.c + ';background:' + F.bg + '" aria-hidden="true"></i>' + escH(F.t) + '</h2>';
      Object.keys(grupos[f]).forEach(function (c) {

          return '<div class="it"><div class="nom">' + escH(x.nombre) + (x.fast_ready ? '<span class="rapido">RÁPIDO</span>' : '') + (x.descripcion ? '<small>' + escH(x.descripcion) + '</small>' : '') + '</div>' +
            '<div class="pre">' + (oferta ? '<s>' + cop(x.precio) + '</s><em>' + cop(x.precio_oferta) + '</em>' : cop(x.precio)) + '</div></div>';

      });

    doc.innerHTML = html;

})();
